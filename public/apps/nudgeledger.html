<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f2ea">
<title>NudgeLedger — Get Paid Without the Awkwardness</title>
<style>
:root{
  --bg:#f4f1e9;
  --surface:#fffdf8;
  --surface-2:#f9f6ef;
  --surface-3:#eee9dd;
  --ink:#20231f;
  --muted:#73776f;
  --line:#dfdbd0;
  --green:#266b4f;
  --green-2:#dff3e7;
  --lime:#d5ed7d;
  --orange:#db762d;
  --orange-2:#fff0e3;
  --red:#c34949;
  --red-2:#fde7e5;
  --blue:#3f70b5;
  --blue-2:#e5eefb;
  --purple:#7559a7;
  --shadow:0 20px 55px rgba(53,48,36,.12);
  --radius:18px;
}

[data-theme="dark"]{
  --bg:#141612;
  --surface:#1c1f1a;
  --surface-2:#232720;
  --surface-3:#2b3028;
  --ink:#f6f3e9;
  --muted:#9da397;
  --line:#343a31;
  --green:#73c99e;
  --green-2:#173b2c;
  --lime:#b9d75c;
  --orange:#f3a160;
  --orange-2:#422b1b;
  --red:#ff8585;
  --red-2:#472526;
  --blue:#86b3f0;
  --blue-2:#21334a;
  --purple:#c1a7f1;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:3px solid color-mix(in srgb,var(--green) 35%,transparent);
  outline-offset:2px;
}
::selection{background:var(--lime);color:#172015}

.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}

.sidebar{
  height:100vh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding:22px 15px;
  border-right:1px solid var(--line);
  background:var(--surface);
  z-index:30;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 9px 25px;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.7px;
}
.logo{
  width:36px;height:36px;
  display:grid;place-items:center;
  background:var(--green);
  color:#fff;
  border-radius:12px;
  transform:rotate(-4deg);
  box-shadow:0 9px 20px color-mix(in srgb,var(--green) 22%,transparent);
}
.brand em{font-style:normal;color:var(--green)}

.nav{display:grid;gap:5px}
.nav-button{
  width:100%;
  min-height:43px;
  border:0;
  border-radius:12px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:11px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-size:13px;
  font-weight:720;
  transition:.18s ease;
}
.nav-button:hover{background:var(--surface-2);color:var(--ink)}
.nav-button.active{background:var(--green-2);color:var(--green)}
.nav-icon{width:20px;text-align:center;font-size:16px}
.nav-count{
  margin-left:auto;
  min-width:23px;height:22px;
  padding:0 7px;
  display:grid;place-items:center;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  font-size:10px;
}

.sidebar-footer{margin-top:auto}
.privacy{
  margin:0 4px 12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface-2);
}
.privacy strong{
  display:flex;align-items:center;gap:7px;
  font-size:11px;
}
.privacy p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 13%,transparent);
}

.main{min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;
  height:72px;
  padding:0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);
}
.top-left{display:flex;align-items:center;gap:12px}
.top-date{
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:1px;
}
.top-message{font-size:14px;font-weight:770;margin-top:3px}
.top-actions{display:flex;gap:9px}

.content{max-width:1480px;margin:auto;padding:30px}

button.btn{
  min-height:40px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:11px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--surface);
  font-size:12px;
  font-weight:780;
  transition:.18s ease;
  white-space:nowrap;
}
button.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(44,42,34,.08)}
button.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
button.btn.lime{background:var(--lime);border-color:var(--lime);color:#1a2514}
button.btn.ghost{background:transparent}
button.btn.danger{color:var(--red)}
button.btn.small{min-height:32px;padding:0 10px;border-radius:9px;font-size:11px}
button.icon-btn{width:40px;padding:0}
.mobile-menu{display:none!important}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
}
.eyebrow{
  color:var(--green);
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:1.3px;
}
.page-head h1{
  margin:5px 0 7px;
  font-size:clamp(28px,3.5vw,43px);
  line-height:1.02;
  letter-spacing:-1.8px;
}
.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(255,255,255,.3);
}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:17px;
}
.kpi{padding:19px;min-height:132px;position:relative;overflow:hidden}
.kpi:after{
  content:"";
  position:absolute;
  width:100px;height:100px;
  right:-40px;top:-40px;
  border-radius:50%;
  background:var(--glow);
  opacity:.12;
  filter:blur(35px);
}
.kpi-label{
  display:flex;align-items:center;justify-content:space-between;
  color:var(--muted);font-size:11px;font-weight:760;
}
.kpi-icon{
  width:29px;height:29px;
  display:grid;place-items:center;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
}
.kpi-value{
  margin:14px 0 6px;
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}
.kpi-note{color:var(--muted);font-size:10px}
.positive{color:var(--green)}
.warning{color:var(--orange)}
.negative{color:var(--red)}

.dashboard-grid{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(310px,.65fr);
  gap:17px;
  margin-bottom:17px;
}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:18px 19px 14px;
  border-bottom:1px solid var(--line);
}
.panel-head h2{font-size:14px;margin:0}
.panel-head p{font-size:10px;color:var(--muted);margin:5px 0 0}

.queue{padding:0}
.queue-item{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.queue-item:last-child{border-bottom:0}
.avatar{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:12px;
  color:#fff;
  background:var(--avatar,var(--green));
  font-size:11px;
  font-weight:850;
}
.item-title{font-size:12px;font-weight:790}
.item-sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.queue-right{text-align:right}
.money{font-size:13px;font-weight:880;font-variant-numeric:tabular-nums}
.days{font-size:9px;color:var(--red);margin-top:4px;font-weight:750}

.health{padding:20px}
.health-score{
  padding:18px;
  border-radius:15px;
  background:var(--green);
  color:#fff;
}
.health-top{display:flex;align-items:center;justify-content:space-between}
.health-number{font-size:44px;font-weight:920;letter-spacing:-2px}
.health-number small{font-size:15px;opacity:.7}
.health p{font-size:11px;line-height:1.55;opacity:.8;margin:8px 0 0}
.health-list{margin-top:18px;display:grid;gap:13px}
.health-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;
}
.health-row span{color:var(--muted)}
.health-row strong{font-size:12px}

.aging-card{margin-bottom:17px;padding:20px}
.aging-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
.aging-head h2{font-size:14px;margin:0}
.aging-head p{font-size:10px;color:var(--muted);margin:5px 0 0}
.aging-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.aging-column{
  padding:14px;
  min-height:132px;
  display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:13px;
  background:var(--surface-2);
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
}
.aging-fill{
  position:absolute;left:0;right:0;bottom:0;
  height:var(--height);
  background:var(--fill);
  opacity:.13;
}
.aging-column strong,.aging-column span{position:relative}
.aging-column strong{font-size:17px}
.aging-column span{font-size:9px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}

.table-card{overflow:hidden}
.toolbar{
  display:flex;align-items:center;gap:9px;
  padding:14px 17px;
  border-bottom:1px solid var(--line);
}
.search{position:relative;flex:1}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}

input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface-2);
  padding:10px 12px;
  color:var(--ink);
}
input,select{height:41px}
textarea{min-height:105px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.35px;
}
.hint{color:var(--muted);font-size:9px;line-height:1.5;margin-top:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}

table{width:100%;border-collapse:collapse}
th{
  padding:12px 17px;
  text-align:left;
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.75px;
}
td{
  padding:14px 17px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.table-actions{display:flex;justify-content:flex-end;gap:6px}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.overdue{background:var(--red-2);color:var(--red)}
.badge.due{background:var(--orange-2);color:var(--orange)}
.badge.open{background:var(--blue-2);color:var(--blue)}
.badge.paid{background:var(--green-2);color:var(--green)}
.badge.draft{background:var(--surface-3);color:var(--muted)}

.client-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.client-card{padding:18px}
.client-top{display:flex;align-items:center;justify-content:space-between}
.client-card h3{margin:14px 0 4px;font-size:14px}
.client-card p{margin:0;color:var(--muted);font-size:10px}
.client-numbers{
  display:grid;grid-template-columns:1fr 1fr;
  gap:9px;margin:16px 0;
}
.client-stat{
  padding:11px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);
}
.client-stat span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;margin-bottom:5px}
.client-stat strong{font-size:12px}
.client-footer{padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.risk{font-size:9px;font-weight:800}

.settings-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:17px}
.settings-card{padding:21px}
.settings-card h2{font-size:14px;margin:0 0 5px}
.settings-card>p{font-size:10px;color:var(--muted);margin:0 0 19px}
.stack{display:grid;gap:9px}

.empty{padding:65px 20px;text-align:center;color:var(--muted)}
.empty-icon{
  width:55px;height:55px;
  margin:0 auto 14px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface-2);
  font-size:22px;
}
.empty h3{margin:0 0 7px;color:var(--ink);font-size:15px}
.empty p{margin:0 auto 16px;max-width:410px;font-size:11px;line-height:1.55}

.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(24,25,21,.68);
  backdrop-filter:blur(8px);
  animation:fade .15s ease;
}
.modal{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:21px;
  box-shadow:var(--shadow);
  animation:pop .2s ease;
}
.modal.wide{width:min(930px,100%)}
.modal-head{
  position:sticky;top:0;z-index:3;
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 21px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(15px);
}
.modal-head h2{font-size:15px;margin:0}
.modal-body{padding:21px}
.modal-foot{
  position:sticky;bottom:0;
  display:flex;justify-content:flex-end;gap:8px;
  padding:15px 21px;
  border-top:1px solid var(--line);
  background:var(--surface);
}

.composer{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:17px;
}
.email-preview{
  padding:22px;
  min-height:440px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface-2);
}
.email-meta{
  display:grid;grid-template-columns:50px 1fr;
  gap:8px;font-size:10px;
  padding-bottom:13px;margin-bottom:16px;
  border-bottom:1px solid var(--line);
}
.email-meta span{color:var(--muted)}
.email-copy{
  white-space:pre-wrap;
  font-family:Georgia,serif;
  font-size:13px;
  line-height:1.7;
}
.composer-side{display:grid;align-content:start;gap:12px}
.insight{
  padding:15px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface-2);
}
.insight strong{display:block;font-size:11px;margin-bottom:6px}
.insight p{font-size:9px;color:var(--muted);line-height:1.5;margin:0}
.fee-box{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
}
.fee-box span{font-size:9px;color:var(--muted)}
.fee-box strong{font-size:16px;color:var(--red)}

.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:200;display:grid;gap:8px}
.toast{
  min-width:250px;
  display:flex;align-items:center;gap:9px;
  padding:13px 14px;
  background:var(--ink);color:var(--surface);
  border-radius:11px;
  box-shadow:var(--shadow);
  font-size:11px;
  animation:pop .18s ease;
}
.toast .dot{background:var(--lime);box-shadow:none}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}

@media(max-width:1050px){
  .kpis{grid-template-columns:1fr 1fr}
  .dashboard-grid{grid-template-columns:1fr}
  .client-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .shell{display:block}
  .sidebar{
    position:fixed;left:-260px;width:244px;
    transition:.2s ease;box-shadow:var(--shadow);
  }
  .sidebar.open{left:0}
  .mobile-menu{display:inline-flex!important}
  .topbar{padding:0 15px}
  .content{padding:20px 14px}
  .page-head{flex-direction:column;align-items:flex-start}
  .page-head>.btn{width:100%}
  .settings-grid,.composer{grid-template-columns:1fr}
  .client-grid{grid-template-columns:1fr}
  .toolbar{flex-wrap:wrap}
  .search{flex-basis:100%}
  .table-scroll{overflow:auto}
  table{min-width:800px}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr}
  .aging-bars{grid-template-columns:1fr 1fr}
  .top-message{display:none}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
}

@media print{
  body *{visibility:hidden!important}
  .email-preview,.email-preview *{visibility:visible!important}
  .email-preview{
    position:absolute;left:0;top:0;
    width:100%;border:0;background:white;color:black;
  }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <span>Nudge<em>Ledger</em></span>
    </div>

    <nav class="nav">
      <button class="nav-button active" data-view="dashboard" onclick="App.setView('dashboard')">
        <span class="nav-icon">⌂</span> Today
      </button>
      <button class="nav-button" data-view="invoices" onclick="App.setView('invoices')">
        <span class="nav-icon">▤</span> Invoices
        <span class="nav-count" id="invoiceCount">0</span>
      </button>
      <button class="nav-button" data-view="clients" onclick="App.setView('clients')">
        <span class="nav-icon">♙</span> Clients
      </button>
      <button class="nav-button" data-view="settings" onclick="App.setView('settings')">
        <span class="nav-icon">⚙</span> Settings
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="privacy">
        <strong><span class="dot"></span> Private by default</strong>
        <p>Financial information remains in this browser unless you export it.</p>
      </div>
      <button class="nav-button" onclick="App.toggleTheme()">
        <span class="nav-icon" id="themeIcon">☾</span> Toggle theme
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="btn icon-btn mobile-menu" onclick="App.toggleSidebar()">☰</button>
        <div>
          <div class="top-date" id="topDate"></div>
          <div class="top-message">A calm system for uncomfortable conversations.</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" onclick="App.exportCSV()">Export CSV</button>
        <button class="btn primary" onclick="App.openInvoiceModal()">＋ Invoice</button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<script>
const App=(()=>{
  const STORAGE_KEY="nudgeledger-v1";
  const DAY=86400000;
  const COLORS=["#266b4f","#3f70b5","#db762d","#7559a7","#b64d6b","#3d8b86"];
  let view="dashboard";
  let query="";
  let filter="all";

  const isoDate=(date=new Date())=>date.toISOString().slice(0,10);
  const offsetDate=days=>{
    const d=new Date();
    d.setDate(d.getDate()+days);
    return isoDate(d);
  };
  const uid=prefix=>prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  const seed=()=>({

  let state=load();

  function load(){
    try{
      const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(parsed?.settings&&Array.isArray(parsed.invoices)) return parsed;
    }catch(e){}
    const initial=seed();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(initial));
    return initial;
  }

  function save(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    applyTheme();
    updateCount();
  }

  function esc(value=""){
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function money(value){
    try{
      return new Intl.NumberFormat(undefined,{
        style:"currency",
        currency:state.settings.currency||"USD",
        maximumFractionDigits:0
      }).format(Number(value)||0);
    }catch(e){
      return "$"+Math.round(Number(value)||0).toLocaleString();
    }
  }

  function shortDate(date){
    if(!date)return "—";
    return new Date(date+"T12:00:00").toLocaleDateString(undefined,{
      month:"short",day:"numeric",year:"numeric"
    });
  }

  function daysFromToday(date){
    const now=new Date();
    now.setHours(0,0,0,0);
    const target=new Date(date+"T00:00:00");
    return Math.round((now-target)/DAY);
  }

  function daysLate(invoice){
    if(invoice.status==="paid")return 0;
    return Math.max(0,daysFromToday(invoice.due));
  }

  function invoiceState(invoice){
    if(invoice.status==="paid")return "paid";
    const delta=daysFromToday(invoice.due);
    if(delta>0)return "overdue";
    if(delta>=-7)return "due";
    return "open";
  }

  function lateFee(invoice){
    const days=daysLate(invoice);
    return invoice.amount*(Number(state.settings.annualLateRate)||0)/100/365*days;
  }

  function initials(name=""){
    return name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?";
  }

  function metrics(){
    const open=state.invoices.filter(i=>i.status!=="paid");
    const outstanding=open.reduce((s,i)=>s+Number(i.amount),0);
    const overdue=open.filter(i=>daysLate(i)>0);
    const overdueAmount=overdue.reduce((s,i)=>s+Number(i.amount),0);
    const dueSoon=open.filter(i=>{
      const d=daysFromToday(i.due);
      return d<=0&&d>=-7;
    });
    const dueSoonAmount=dueSoon.reduce((s,i)=>s+Number(i.amount),0);
    const recovered=state.invoices.filter(i=>i.status==="paid").reduce((s,i)=>s+Number(i.amount),0);
    const averageLate=overdue.length
      ?Math.round(overdue.reduce((s,i)=>s+daysLate(i),0)/overdue.length):0;
    return {outstanding,overdueAmount,dueSoonAmount,recovered,averageLate,overdue};
  }

    view=next;

    document.getElementById("sidebar").classList.remove("open");
    render();

    if(view==="settings")renderSettings();
    updateCount();

          color:i.color,invoices:[],outstanding:0,overdue:0,paid:0

      const c=map[i.client];
      c.invoices.push(i);
      if(i.status==="paid")c.paid+=i.amount;
      else{
        c.outstanding+=i.amount;
        if(daysLate(i)>0)c.overdue+=i.amount;
      }

    const clients=Object.values(map).sort((a,b)=>b.outstanding-a.outstanding);

    document.getElementById("content").innerHTML=`

  function saveInvoice(event,id){
    event.preventDefault();
    const f=new FormData(event.target);
    const existing=id?state.invoices.find(i=>i.id===id):null;

    const invoice={
      id:id||uid("inv"),
      number:f.get("number").trim(),
      client:f.get("client").trim(),
      contact:f.get("contact").trim(),
      email:f.get("email").trim(),
      amount:Number(f.get("amount")),
      issued:f.get("issued"),
      due:f.get("due"),
      description:f.get("description").trim(),
      paymentLink:f.get("paymentLink").trim(),
      status:f.get("status")||existing?.status||"open",
      reminders:existing?.reminders||0,
      lastContact:existing?.lastContact||"",
      paidDate:(f.get("status")==="paid"&&!existing?.paidDate)?isoDate():(existing?.paidDate||""),
      color:existing?.color||COLORS[state.invoices.length%COLORS.length]
    };

    if(existing)Object.assign(existing,invoice);
    else state.invoices.push(invoice);

    save();
    closeModal();
    render();
    toast(existing?"Invoice updated":"Invoice added to ledger");
  }

  function reminderStage(invoice){
    const days=daysLate(invoice);
    if(days===0&&daysFromToday(invoice.due)<0){
      return {
        key:"preventive",
        label:"Friendly pre-due reminder",
        subject:`A quick heads-up: ${invoice.number} is due ${shortDate(invoice.due)}`
      };
    }
    if(days<=7){
      return {
        key:"gentle",
        label:"Gentle payment reminder",
        subject:`Quick check-in on invoice ${invoice.number}`
      };
    }
    if(days<=21){
      return {
        key:"firm",
        label:"Firm follow-up",
        subject:`Payment follow-up required: ${invoice.number}`
      };
    }
    return {
      key:"final",
      label:"Final internal escalation",
      subject:`Overdue invoice ${invoice.number} — action required`
    };
  }

  function messageFor(invoice,tone="balanced",includeFee=false){
    const stage=reminderStage(invoice);
    const name=invoice.contact||invoice.client;
    const fee=includeFee?lateFee(invoice):0;
    const link=invoice.paymentLink||state.settings.paymentLink;
    const late=daysLate(invoice);

    const openings={
      warm:`I hope you’re doing well. I wanted to send a quick note about invoice ${invoice.number} for ${money(invoice.amount)}.`,
      balanced:`I’m following up regarding invoice ${invoice.number} for ${money(invoice.amount)}.`,
      direct:`Invoice ${invoice.number}, totaling ${money(invoice.amount)}, remains unpaid.`
    };

    let body="";

    if(stage.key==="preventive"){
      body=`${openings[tone]}

The invoice is due on ${shortDate(invoice.due)}. I’m sending this ahead of time in case your accounts team needs anything from me to process it.`;
    }else if(stage.key==="gentle"){
      body=`${openings[tone]}

It was due on ${shortDate(invoice.due)} and is currently ${late} day${late===1?"":"s"} overdue. It may simply have slipped through, so could you confirm its payment status?`;
    }else if(stage.key==="firm"){
      body=`${openings[tone]}

It was due on ${shortDate(invoice.due)} and is now ${late} days overdue. Please arrange payment or let me know the specific date it has been scheduled for.`;
    }else{
      body=`${openings[tone]}

It is now ${late} days past its ${shortDate(invoice.due)} due date. Please provide payment confirmation or a written payment date within two business days. I’ll otherwise need to follow the remedies available under our agreement.`;
    }

    if(includeFee&&fee>0){
      body+=`\n\nAt the configured annual rate, the accrued late charge is currently ${money(fee)}. Please verify that any fee is authorized by the signed agreement and applicable law before requesting it.`;
    }

    if(link){
      body+=`\n\nPayment link: ${link}`;
    }

    body+=`\n\nIf payment has already been sent, please disregard this note and send the remittance details so I can update my records.

Thank you,
${state.settings.owner}
${state.settings.business}`;

    return body;
  }

  function openReminder(id){
    const invoice=state.invoices.find(i=>i.id===id);
    if(!invoice)return;

    document.getElementById("modalRoot").innerHTML=`
      <div class="modal-backdrop" onclick="App.backdropClose(event)">
        <div class="modal wide">
          <div class="modal-head">
            <h2>Payment reminder · ${esc(invoice.number)}</h2>
            <button class="btn icon-btn ghost" onclick="App.closeModal()">×</button>
          </div>

          <div class="modal-body">
            <div class="composer">
              <div class="email-preview">
                <div class="email-meta">
                  <span>To</span><strong>${esc(invoice.email)}</strong>
                  <span>Subject</span><strong id="subjectPreview"></strong>
                </div>
                <div class="email-copy" id="messagePreview"></div>
              </div>

              <aside class="composer-side">
                <div>
                  <label>TONE</label>
                  <select id="toneSelect" onchange="App.refreshReminder('${invoice.id}')">
                    <option value="warm">Warm and collaborative</option>
                    <option value="balanced" selected>Calm and professional</option>
                    <option value="direct">Direct and concise</option>
                  </select>
                </div>

                <div>
                  <label>SUBJECT</label>
                  <input id="subjectInput" oninput="App.syncSubject()" value="${esc(reminderStage(invoice).subject)}">
                </div>

                <label style="display:flex;align-items:center;gap:8px;margin:0">
                  <input id="includeFee" style="width:17px;height:17px" type="checkbox" onchange="App.refreshReminder('${invoice.id}')">
                  Mention calculated late fee
                </label>

                <div class="insight">
                  <strong>${esc(reminderStage(invoice).label)}</strong>
                  <p>
                    ${daysLate(invoice)
                      ?`${daysLate(invoice)} days overdue with ${invoice.reminders||0} previous reminder${invoice.reminders===1?"":"s"}.`
                      :"Preventive reminders reduce ambiguity before the due date."}
                  </p>
                  <div class="fee-box">
                    <span>Calculated fee</span>
                    <strong>${money(lateFee(invoice))}</strong>
                  </div>
                </div>

                <div class="insight">
                  <strong>Next step</strong>
                  <p>Send the message, then schedule the next review instead of repeatedly checking your inbox.</p>
                </div>

                <button class="btn" onclick="App.downloadReminder('${invoice.id}')">＋ Add follow-up to calendar</button>
              </aside>
            </div>
          </div>

          <div class="modal-foot">
            <button class="btn ghost" onclick="window.print()">Print</button>
            <button class="btn" onclick="App.copyReminder('${invoice.id}')">Copy message</button>
            <button class="btn primary" onclick="App.sendReminder('${invoice.id}')">Open in email →</button>
          </div>
        </div>
      </div>
    `;

    refreshReminder(id);
  }

  function refreshReminder(id){
    const invoice=state.invoices.find(i=>i.id===id);
    const tone=document.getElementById("toneSelect")?.value||"balanced";
    const includeFee=document.getElementById("includeFee")?.checked||false;
    const preview=document.getElementById("messagePreview");
    if(preview)preview.textContent=messageFor(invoice,tone,includeFee);
    syncSubject();
  }

  function syncSubject(){
    const input=document.getElementById("subjectInput");
    const preview=document.getElementById("subjectPreview");
    if(input&&preview)preview.textContent=input.value;
  }

  function openNextReminder(){
    const next=state.invoices
      .filter(i=>i.status!=="paid"&&daysFromToday(i.due)>=-3)
      .sort((a,b)=>{
        const aScore=daysLate(a)*10+a.amount/1000-(a.reminders||0);
        const bScore=daysLate(b)*10+b.amount/1000-(b.reminders||0);
        return bScore-aScore;
      })[0];

    if(next)openReminder(next.id);
    else toast("Your collection queue is clear");
  }

  async function copyReminder(id){
    const invoice=state.invoices.find(i=>i.id===id);
    const tone=document.getElementById("toneSelect")?.value||"balanced";
    const includeFee=document.getElementById("includeFee")?.checked||false;
    try{
      await navigator.clipboard.writeText(messageFor(invoice,tone,includeFee));
      toast("Reminder copied");
    }catch(e){
      toast("Clipboard permission was unavailable");
    }
  }

  function sendReminder(id){
    const invoice=state.invoices.find(i=>i.id===id);
    const tone=document.getElementById("toneSelect")?.value||"balanced";
    const includeFee=document.getElementById("includeFee")?.checked||false;
    const subject=document.getElementById("subjectInput")?.value||reminderStage(invoice).subject;
    const message=messageFor(invoice,tone,includeFee);

    location.href=`mailto:${encodeURIComponent(invoice.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
    toast("Email draft opened — log it only after you confirm it was sent");
  }

  function downloadReminder(id){
    const invoice=state.invoices.find(i=>i.id===id);
    const d=new Date();
    d.setDate(d.getDate()+5);
    d.setHours(9,0,0,0);
    const end=new Date(d.getTime()+30*60000);
    const stamp=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");

    const ics=[
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//NudgeLedger//Invoice Follow-up//EN",
      "BEGIN:VEVENT",
      `UID:${uid("calendar")}@nudgeledger`,
      `DTSTAMP:${stamp(new Date())}`,
      `DTSTART:${stamp(d)}`,
      `DTEND:${stamp(end)}`,
      `SUMMARY:Follow up on ${invoice.number} — ${invoice.client}`,
      `DESCRIPTION:Review payment status for ${invoice.number}, ${money(invoice.amount)}.`,
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    downloadBlob(ics,`follow-up-${invoice.number}.ics`,"text/calendar");
    toast("Calendar reminder downloaded");
  }

  function markPaid(id){
    const invoice=state.invoices.find(i=>i.id===id);
    if(!invoice)return;
    if(!confirm(`Mark ${invoice.number} as paid?`))return;
    invoice.status="paid";
    invoice.paidDate=isoDate();
    save();
    render();
    toast(`${invoice.number} marked as paid`);
  }

  function deleteInvoice(id){
    if(!confirm("Delete this invoice permanently?"))return;
    state.invoices=state.invoices.filter(i=>i.id!==id);
    save();
    closeModal();
    render();
    toast("Invoice deleted");
  }

  function saveSettings(event){
    event.preventDefault();
    const f=new FormData(event.target);
    state.settings={
      ...state.settings,
      business:f.get("business").trim(),
      owner:f.get("owner").trim(),
      email:f.get("email").trim(),
      currency:f.get("currency"),
      annualLateRate:Number(f.get("annualLateRate")),
      paymentLink:f.get("paymentLink").trim()
    };
    save();
    render();
    toast("Collection rules saved");
  }

  function exportJSON(){
    downloadBlob(
      JSON.stringify(state,null,2),
      `nudgeledger-backup-${isoDate()}.json`,
      "application/json"
    );
    toast("Backup exported");
  }

  function exportCSV(){
    const columns=[
      "Invoice","Client","Contact","Email","Description",
      "Amount","Issued","Due","Status","Days overdue","Reminders"
    ];

    const rows=state.invoices.map(i=>[
      i.number,i.client,i.contact,i.email,i.description,
      i.amount,i.issued,i.due,invoiceState(i),daysLate(i),i.reminders||0
    ]);

    const csv=[columns,...rows].map(row=>
      row.map(value=>`"${String(value??"").replaceAll('"','""')}"`).join(",")
    ).join("\n");

    downloadBlob(csv,`nudgeledger-invoices-${isoDate()}.csv`,"text/csv");
    toast("CSV exported");
  }

  function downloadBlob(content,name,type){
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importJSON(file){
    if(!file)return;
    try{
      const parsed=JSON.parse(await file.text());
      if(!parsed.settings||!Array.isArray(parsed.invoices))throw new Error();
      state=parsed;
      save();
      render();
      toast("Backup imported");
    }catch(e){
      alert("This is not a valid NudgeLedger backup.");
    }
  }

  function resetData(){
    if(!confirm("Replace all current invoices with demonstration data?"))return;
    state=seed();
    save();
    render();
    toast("Demo workspace restored");
  }

  function search(value){query=value;render()}
  function setFilter(value){filter=value;render()}

  function title(value){
    return value.charAt(0).toUpperCase()+value.slice(1);
  }

  function daysFromPair(later,earlier){
    if(!later||!earlier)return 0;
    return Math.round((
      new Date(later+"T00:00:00")-
      new Date(earlier+"T00:00:00")
    )/DAY);
  }

  function empty(titleText,body,action,label){
    return `<div class="empty">
      <div class="empty-icon">◎</div>
      <h3>${titleText}</h3>
      <p>${body}</p>
      <button class="btn primary" onclick="${action}">${label}</button>
    </div>`;
  }

  function applyTheme(){
    document.documentElement.dataset.theme=state.settings.theme==="dark"?"dark":"light";
    const icon=document.getElementById("themeIcon");
    if(icon)icon.textContent=state.settings.theme==="dark"?"☀":"☾";
  }

  function toggleTheme(){
    state.settings.theme=state.settings.theme==="dark"?"light":"dark";
    save();
  }

  function updateCount(){
    const count=document.getElementById("invoiceCount");
    if(count)count.textContent=state.invoices.filter(i=>i.status!=="paid").length;
  }

  function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
  }

  function closeModal(){
    document.getElementById("modalRoot").innerHTML="";
  }

  function backdropClose(event){
    if(event.target.classList.contains("modal-backdrop"))closeModal();
  }

  function toast(message){
    const wrap=document.getElementById("toastWrap");
    const el=document.createElement("div");
    el.className="toast";
    el.innerHTML=`<span class="dot"></span>${esc(message)}`;
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),2700);
  }

  document.getElementById("topDate").textContent=
    new Date().toLocaleDateString(undefined,{
      weekday:"long",month:"long",day:"numeric"
    });

  document.getElementById("importFile").addEventListener("change",event=>{
    importJSON(event.target.files[0]);
    event.target.value="";
  });

  document.addEventListener("keydown",event=>{
    if(event.key==="Escape")closeModal();
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){
      event.preventDefault();
      openNextReminder();
    }
  });

  applyTheme();
  render();

  return {
    setView,toggleSidebar,toggleTheme,
    openInvoiceModal,saveInvoice,deleteInvoice,markPaid,
    openReminder,openNextReminder,refreshReminder,syncSubject,
    copyReminder,sendReminder,downloadReminder,
    search,setFilter,saveSettings,
    exportJSON,exportCSV,resetData,
    closeModal,backdropClose
  };
})();
</script>
</body>
</html>
