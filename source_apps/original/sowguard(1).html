<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0f">
<title>SOWGuard — Stop Working For Free</title>
<style>
:root{
  --bg:#0a0b0f;
  --sidebar:#0d0f14;
  --panel:#12151c;
  --panel-2:#171b24;
  --panel-3:#1c212c;
  --text:#f5f7fb;
  --muted:#8f98aa;
  --line:#252b38;
  --accent:#b8ff5a;
  --accent-dark:#6ba81c;
  --orange:#ffb454;
  --red:#ff6b6b;
  --blue:#69a8ff;
  --purple:#b895ff;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --radius:18px;
}

[data-theme="light"]{
  --bg:#f4f6f0;
  --sidebar:#eef1e9;
  --panel:#fff;
  --panel-2:#f6f8f3;
  --panel-3:#edf1e9;
  --text:#171b18;
  --muted:#677064;
  --line:#dfe4db;
  --accent:#72bd17;
  --accent-dark:#4e8b09;
  --shadow:0 18px 50px rgba(41,55,35,.12);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
::selection{background:var(--accent);color:#10130b}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#303746;border-radius:20px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  z-index:20;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:4px 8px 24px;
  font-weight:850;
  font-size:18px;
  letter-spacing:-.5px;
}
.logo{
  width:34px;height:34px;
  display:grid;place-items:center;
  color:#0c1205;
  background:var(--accent);
  border-radius:11px;
  box-shadow:0 8px 22px rgba(151,230,50,.23);
}
.logo svg{width:19px;height:19px}
.brand span:last-child em{color:var(--accent);font-style:normal}

.nav{display:flex;flex-direction:column;gap:5px}
.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px 12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  text-align:left;
  font-size:14px;
  font-weight:650;
  transition:.18s ease;
}
.nav-btn:hover{background:var(--panel-2);color:var(--text)}
.nav-btn.active{
  color:var(--text);
  background:var(--panel-3);
}
.nav-icon{width:20px;text-align:center;font-size:16px}
.nav-count{
  margin-left:auto;
  min-width:22px;height:22px;
  padding:0 7px;
  display:grid;place-items:center;
  border-radius:20px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
}

.sidebar-bottom{margin-top:auto}
.local-badge{
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
}
.local-badge strong{
  display:flex;align-items:center;gap:7px;
  font-size:12px;
}
.local-badge p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.pulse{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(184,255,90,.12);
}

.main{min-width:0}
.topbar{
  height:74px;
  padding:0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:15;
}
.eyebrow{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.3px;
}
.top-title{margin-top:3px;font-weight:760;font-size:15px}
.top-actions{display:flex;align-items:center;gap:9px}

.content{padding:30px;max-width:1500px;margin:auto}
.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}
.page-head h1{
  margin:3px 0 6px;
  font-size:clamp(27px,3vw,40px);
  line-height:1.05;
  letter-spacing:-1.5px;
}
.page-head p{margin:0;color:var(--muted);font-size:14px}

.btn{
  border:1px solid var(--line);
  background:var(--panel-2);
  border-radius:11px;
  min-height:40px;
  padding:0 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  font-weight:740;
  font-size:13px;
  transition:.18s ease;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);border-color:#3a4354;background:var(--panel-3)}
.btn.primary{
  border-color:var(--accent);
  background:var(--accent);
  color:#10150a;
  box-shadow:0 10px 25px rgba(154,225,65,.15);
}
.btn.primary:hover{background:#c6ff7e}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.small{min-height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.icon-btn{width:40px;padding:0}
.mobile-menu{display:none}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(255,255,255,.02);
}
.kpi{padding:20px;min-height:136px;position:relative;overflow:hidden}
.kpi:after{
  content:"";
  position:absolute;
  width:100px;height:100px;
  right:-45px;top:-45px;
  border-radius:50%;
  background:var(--glow,var(--accent));
  filter:blur(45px);
  opacity:.12;
}
.kpi-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.kpi-icon{
  width:30px;height:30px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel-2);
}
.kpi-value{
  font-size:29px;
  letter-spacing:-1px;
  font-weight:850;
  margin:15px 0 6px;
}
.kpi-note{color:var(--muted);font-size:11px}
.up{color:var(--accent)}
.warn{color:var(--orange)}
.danger-text{color:var(--red)}

.dashboard-grid{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);
  gap:18px;
  margin-bottom:18px;
}
.panel-head{
  padding:18px 20px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.panel-head h2{font-size:15px;margin:0}
.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.chart-wrap{height:270px;padding:18px 18px 12px}
canvas{width:100%;height:100%}

.quick-card{
  padding:25px;
  background:
    radial-gradient(circle at 100% 0,rgba(184,255,90,.12),transparent 42%),
    var(--panel);
}
.quick-card h2{font-size:21px;letter-spacing:-.6px;margin:14px 0 8px}
.quick-card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}
.quick-logo{
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:13px;
  background:var(--accent);
  color:#0e1408;
  font-size:21px;
}
.quick-list{
  margin:21px 0;
  padding-top:18px;
  border-top:1px solid var(--line);
  display:grid;gap:12px;
}
.quick-item{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.check{
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(184,255,90,.11);
  color:var(--accent);
  font-size:11px;
}

.table-card{overflow:hidden}
.toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.search{
  position:relative;
  flex:1;
}
.search input{padding-left:38px}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  transition:.18s;
}
input{height:41px}
textarea{min-height:105px;resize:vertical;line-height:1.5}
input:hover,textarea:hover,select:hover{border-color:#3a4352}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
select{height:41px}
option{background:var(--panel)}
label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:760;
  margin-bottom:7px;
}
.field{min-width:0}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-grid .full{grid-column:1/-1}

table{width:100%;border-collapse:collapse}
th{
  padding:12px 18px;
  text-align:left;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:800;
  border-bottom:1px solid var(--line);
}
td{
  padding:15px 18px;
  font-size:12px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tr:last-child td{border-bottom:0}
tbody tr{transition:.15s}
tbody tr:hover{background:var(--panel-2)}
.item-title{font-weight:750;font-size:13px}
.item-sub{color:var(--muted);font-size:11px;margin-top:4px}
.amount{font-weight:820;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:flex-end;gap:7px}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.badge:before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:currentColor;
}
.status-draft{color:var(--muted)}
.status-sent{color:var(--blue)}
.status-approved{color:var(--accent)}
.status-paid{color:var(--purple)}
.status-declined{color:var(--red)}
.status-waived{color:var(--orange)}

.projects-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.project-card{padding:19px}
.project-top{display:flex;justify-content:space-between;gap:12px}
.project-avatar{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  color:#10140b;
  font-weight:850;
  background:var(--project-color,var(--accent));
}
.project-card h3{font-size:15px;margin:16px 0 5px}
.project-card .client{color:var(--muted);font-size:11px}
.project-stats{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:18px;
}
.mini-stat{
  padding:11px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:11px;
}
.mini-stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:5px}
.mini-stat strong{font-size:13px}
.scope-preview{
  height:44px;
  overflow:hidden;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
  margin:16px 0;
}
.project-footer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:15px}

.empty{
  padding:70px 25px;
  text-align:center;
  color:var(--muted);
}
.empty-icon{
  width:55px;height:55px;
  margin:0 auto 15px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:17px;
  background:var(--panel-2);
  font-size:24px;
}
.empty h3{color:var(--text);margin:0 0 8px;font-size:16px}
.empty p{max-width:420px;margin:0 auto 17px;font-size:12px;line-height:1.6}

.settings-grid{
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);
  gap:18px;
}
.settings-card{padding:22px}
.settings-card h2{font-size:15px;margin:0 0 5px}
.settings-card>p{font-size:11px;color:var(--muted);margin:0 0 20px}
.setting-section{padding:18px 0;border-top:1px solid var(--line)}
.setting-section:first-of-type{border-top:0;padding-top:0}
.danger-zone{border-color:rgba(255,107,107,.25)}

.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .16s ease;
}
.modal{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:21px;
  box-shadow:var(--shadow);
  animation:popIn .2s ease;
}
.modal.wide{width:min(980px,100%)}
.modal-head{
  padding:19px 22px;
  position:sticky;top:0;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:4;
}
.modal-head h2{font-size:16px;margin:0}
.modal-body{padding:22px}
.modal-foot{
  padding:16px 22px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  position:sticky;bottom:0;
  background:var(--panel);
}

.analyzer-grid{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);
  gap:18px;
}
.analysis{
  padding:17px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel-2);
  position:sticky;
  top:72px;
}
.analysis-score{display:flex;align-items:center;justify-content:space-between}
.risk-ring{
  --score:50;
  width:70px;height:70px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--ring-color,var(--orange)) calc(var(--score)*1%),var(--line) 0);
  position:relative;
}
.risk-ring:after{
  content:"";
  position:absolute;inset:7px;border-radius:50%;
  background:var(--panel-2);
}
.risk-ring strong{position:relative;z-index:1;font-size:18px}
.risk-label strong{display:block;font-size:14px;margin-bottom:5px}
.risk-label span{color:var(--muted);font-size:10px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}
.flag{
  padding:5px 7px;border-radius:7px;
  background:rgba(255,180,84,.1);
  color:var(--orange);
  border:1px solid rgba(255,180,84,.18);
  font-size:9px;font-weight:700;
}
.quote-box{
  padding-top:15px;
  margin-top:15px;
  border-top:1px solid var(--line);
}
.quote-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.quote-total{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.quote-total span{font-size:11px;color:var(--muted)}
.quote-total strong{font-size:25px;color:var(--accent);letter-spacing:-1px}

.doc-wrap{background:#e9e9e4;padding:28px}
.document{
  max-width:760px;
  min-height:900px;
  margin:auto;
  padding:54px;
  background:#fff;
  color:#1b1e1b;
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  font-family:Arial,sans-serif;
}
.doc-head{display:flex;justify-content:space-between;gap:30px;padding-bottom:28px;border-bottom:2px solid #161916}
.doc-brand{font-weight:900;font-size:20px}
.doc-brand span{color:#69a60e}
.doc-meta{text-align:right;font-size:11px;color:#626862;line-height:1.6}
.document h1{font-size:34px;margin:34px 0 8px;letter-spacing:-1.5px}
.doc-sub{color:#687068;font-size:12px;margin-bottom:34px}
.doc-section{margin:28px 0}
.doc-section h3{
  margin:0 0 10px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:#707770;
}
.doc-section p,.doc-section li{font-size:12px;line-height:1.65}
.doc-impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.doc-impact div{padding:14px;background:#f1f3ef;border-radius:8px}
.doc-impact span{display:block;font-size:9px;color:#747a74;text-transform:uppercase;margin-bottom:6px}
.doc-impact strong{font-size:14px}
.doc-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:30px;padding:20px;
  background:#171b17;color:#fff;border-radius:10px;
}
.doc-total strong{font-size:25px;color:#b8ff5a}
.signatures{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:70px}
.signature-line{border-top:1px solid #8b908b;padding-top:8px;font-size:10px;color:#777}
.doc-legal{font-size:9px!important;color:#777;line-height:1.5!important;margin-top:35px}

.toast-wrap{
  position:fixed;
  right:20px;bottom:20px;
  display:grid;gap:8px;
  z-index:200;
}
.toast{
  min-width:260px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-3);
  box-shadow:var(--shadow);
  font-size:12px;
  display:flex;align-items:center;gap:10px;
  animation:toastIn .2s ease;
}
.toast-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:1050px){
  .kpis{grid-template-columns:1fr 1fr}
  .projects-grid{grid-template-columns:1fr 1fr}
  .dashboard-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  .app{display:block}
  .sidebar{
    position:fixed;left:-260px;width:240px;
    transition:.22s;box-shadow:var(--shadow);
  }
  .sidebar.open{left:0}
  .mobile-menu{display:inline-flex}
  .topbar{padding:0 17px}
  .content{padding:20px 15px}
  .page-head{align-items:flex-start;flex-direction:column}
  .page-head .btn{width:100%}
  .kpis{grid-template-columns:1fr 1fr}
  .projects-grid,.settings-grid,.analyzer-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  .analysis{position:static}
  .toolbar{flex-wrap:wrap}
  .toolbar .search{flex-basis:100%}
  .table-scroll{overflow:auto}
  table{min-width:750px}
  .document{padding:30px}
  .doc-impact{grid-template-columns:1fr}
  .doc-wrap{padding:10px}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr}
  .top-title{display:none}
  .projects-grid{grid-template-columns:1fr}
}

@media print{
  body *{visibility:hidden!important}
  #printDocument,#printDocument *{visibility:visible!important}
  #printDocument{
    position:absolute;
    left:0;top:0;
    width:100%;
    max-width:none;
    min-height:0;
    padding:35px;
    box-shadow:none;
  }
  @page{margin:12mm}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 3 20 7v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4Z"/>
          <path d="m8.5 12 2.2 2.2 4.8-5"/>
        </svg>
      </div>
      <span>SOW<em>Guard</em></span>
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-view="dashboard" onclick="App.setView('dashboard')">
        <span class="nav-icon">⌂</span> Dashboard
      </button>
      <button class="nav-btn" data-view="requests" onclick="App.setView('requests')">
        <span class="nav-icon">↗</span> Change orders
        <span class="nav-count" id="requestCount">0</span>
      </button>
      <button class="nav-btn" data-view="projects" onclick="App.setView('projects')">
        <span class="nav-icon">◇</span> Projects
      </button>
      <button class="nav-btn" data-view="settings" onclick="App.setView('settings')">
        <span class="nav-icon">⚙</span> Settings
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="local-badge">
        <strong><span class="pulse"></span> Local-first</strong>
        <p>Your client information stays inside this browser.</p>
      </div>
      <button class="nav-btn" style="width:100%" onclick="App.toggleTheme()">
        <span class="nav-icon" id="themeIcon">☼</span> Toggle theme
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn icon-btn mobile-menu" onclick="App.toggleSidebar()">☰</button>
        <div>
          <div class="eyebrow" id="topEyebrow">Profit protection</div>
          <div class="top-title" id="topTitle">Stop doing unbilled work</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" onclick="App.openProjectModal()">＋ Project</button>
        <button class="btn primary" onclick="App.openRequestModal()">⚡ Analyze request</button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const App = (() => {
  const KEY = "sowguard-v1";
  const PALETTE = ["#b8ff5a","#69a8ff","#ffb454","#b895ff","#ff7f9f","#60dfc2"];
  let view = "dashboard";
  let search = "";
  let statusFilter = "all";

  const today = () => new Date().toISOString().slice(0,10);
  const dateOffset = days => {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  };
  const uid = prefix =>
    prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  const demoState = () => ({
    settings:{
      business:"Northstar Studio",
      owner:"Alex Morgan",
      email:"alex@northstar.studio",
      currency:"USD",
      defaultRate:125,
      defaultBuffer:20,
      theme:"dark"
    },
    projects:[
      {
        id:"p_atlas",
        name:"Atlas Website Redesign",
        client:"Atlas Analytics",
        email:"maya@atlas.example",
        budget:12000,
        rate:125,
        deadline:dateOffset(31),
        revisions:2,
        scope:"Strategy workshop; information architecture; responsive design for 8 core pages; Webflow development; CMS configuration; two revision rounds; basic analytics setup.",
        created:dateOffset(-42),
        color:"#b8ff5a"
      },
      {
        id:"p_orbit",
        name:"Orbit Launch Campaign",
        client:"Orbit Labs",
        email:"sam@orbit.example",
        budget:8500,
        rate:140,
        deadline:dateOffset(19),
        revisions:2,
        scope:"Campaign strategy; launch messaging; 12 social assets; three email sequences; landing page copy; two revision rounds.",
        created:dateOffset(-29),
        color:"#69a8ff"
      },
      {
        id:"p_harbor",
        name:"Harbor Brand System",
        client:"Harbor Health",
        email:"lena@harbor.example",
        budget:16000,
        rate:150,
        deadline:dateOffset(48),
        revisions:3,
        scope:"Brand strategy; logo suite; color and typography system; icon direction; 30-page brand guide; three revision rounds.",
        created:dateOffset(-18),
        color:"#b895ff"
      }
    ],
    changes:[
      {
        id:"c_1042",
        projectId:"p_atlas",
        title:"Add partner portal",
        request:"Could we also add a password-protected partner portal with document uploads? Ideally before launch.",
        hours:22,rate:125,buffer:25,rush:20,timeline:8,type:"Major",
        amount:4125,status:"approved",created:dateOffset(-18)
      },
      {
        id:"c_1047",
        projectId:"p_orbit",
        title:"Additional launch video cutdowns",
        request:"Can you make six vertical video cutdowns for social? This should be a quick addition.",
        hours:9,rate:140,buffer:20,rush:0,timeline:3,type:"Standard",
        amount:1525,status:"paid",created:dateOffset(-12)
      },
      {
        id:"c_1051",
        projectId:"p_atlas",
        title:"CRM integration",
        request:"Please integrate the forms with HubSpot and add lead source tracking.",
        hours:8,rate:125,buffer:20,rush:0,timeline:2,type:"Standard",
        amount:1200,status:"sent",created:dateOffset(-7)
      },
      {
        id:"c_1054",
        projectId:"p_harbor",
        title:"Packaging concepts",
        request:"We would love to see three packaging concepts as part of the brand presentation.",
        hours:14,rate:150,buffer:25,rush:0,timeline:5,type:"Major",
        amount:2650,status:"draft",created:dateOffset(-3)
      },
      {
        id:"c_1056",
        projectId:"p_orbit",
        title:"Extra email revision",
        request:"One more small revision to the launch sequence.",
        hours:2,rate:140,buffer:20,rush:0,timeline:1,type:"Minor",
        amount:350,status:"waived",created:dateOffset(-1)
      }
    ]
  });

  let state = load();

  function load(){
    try{
      const parsed = JSON.parse(localStorage.getItem(KEY));
      if(parsed?.settings && Array.isArray(parsed.projects) && Array.isArray(parsed.changes)){
        return parsed;
      }
    }catch(e){}
    const seed = demoState();
    localStorage.setItem(KEY,JSON.stringify(seed));
    return seed;
  }

  function save(){
    localStorage.setItem(KEY,JSON.stringify(state));
    updateTheme();
    updateCounts();
  }

  function esc(value=""){
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function money(value){
    try{
      return new Intl.NumberFormat(undefined,{
        style:"currency",
        currency:state.settings.currency || "USD",
        maximumFractionDigits:0
      }).format(Number(value)||0);
    }catch(e){
      return "$" + Math.round(Number(value)||0).toLocaleString();
    }
  }

  function shortDate(date){
    if(!date) return "—";
    return new Date(date+"T12:00:00").toLocaleDateString(undefined,{
      month:"short",day:"numeric",year:"numeric"
    });
  }

  function getProject(id){
    return state.projects.find(p => p.id === id);
  }

  function changeAmount(c){
    if(Number.isFinite(Number(c.amount))) return Number(c.amount);
    const raw = Number(c.hours)*Number(c.rate)*(1+Number(c.buffer)/100)*(1+Number(c.rush)/100);
    return Math.ceil(raw/25)*25;
  }

  function metrics(){
    const approved = state.changes.filter(c => ["approved","paid"].includes(c.status));
    const protectedRevenue = approved.reduce((sum,c)=>sum+changeAmount(c),0);
    const allPotential = state.changes
      .filter(c=>!["declined","waived"].includes(c.status))
      .reduce((sum,c)=>sum+changeAmount(c),0);
    const hours = approved.reduce((sum,c)=>sum+Number(c.hours||0),0);
    const open = state.changes.filter(c=>["draft","sent"].includes(c.status)).length;
    const sent = state.changes.filter(c=>c.status==="sent").reduce((s,c)=>s+changeAmount(c),0);
    return {protectedRevenue,allPotential,hours,open,sent};
  }

  function updateTheme(){
    document.documentElement.dataset.theme = state.settings.theme === "light" ? "light" : "dark";
    const icon = document.getElementById("themeIcon");
    if(icon) icon.textContent = state.settings.theme === "light" ? "☾" : "☼";
  }

  function updateCounts(){
    const el = document.getElementById("requestCount");
    if(el) el.textContent = state.changes.length;
  }

  function setView(next){
    view = next;
    search = "";
    statusFilter = "all";
    document.querySelectorAll(".nav-btn[data-view]").forEach(btn=>{
      btn.classList.toggle("active",btn.dataset.view===view);
    });
    document.getElementById("sidebar").classList.remove("open");
    render();
  }

  function render(){
    const titles = {
      dashboard:["Profit protection","Stop doing unbilled work"],
      requests:["Change control","Every extra request, accounted for"],
      projects:["Scope baselines","Define what is—and is not—included"],
      settings:["Workspace","Your data, rates and backups"]
    };
    document.getElementById("topEyebrow").textContent=titles[view][0];
    document.getElementById("topTitle").textContent=titles[view][1];

    const root=document.getElementById("content");
    if(view==="dashboard") root.innerHTML=renderDashboard();
    if(view==="requests") root.innerHTML=renderRequests();
    if(view==="projects") root.innerHTML=renderProjects();
    if(view==="settings") root.innerHTML=renderSettings();

    updateCounts();
    if(view==="dashboard") requestAnimationFrame(drawChart);
  }

  function renderDashboard(){
    const m=metrics();
    const recent=[...state.changes].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5);
    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">${esc(state.settings.business)}</div>
          <h1>Your margin has a bodyguard.</h1>
          <p>Turn casual extras into approved revenue before work begins.</p>
        </div>
        <button class="btn primary" onclick="App.openRequestModal()">⚡ Analyze a client request</button>
      </div>

      <section class="kpis">
        ${kpi("Protected revenue",money(m.protectedRevenue),"Approved and paid changes","↑","#b8ff5a")}
        ${kpi("Revenue identified",money(m.allPotential),"Across all active requests","◎","#69a8ff")}
        ${kpi("Hours protected",Math.round(m.hours)+"h","No longer given away","◷","#b895ff")}
        ${kpi("Awaiting decisions",m.open,money(m.sent)+" currently with clients","!","#ffb454")}
      </section>

      <section class="dashboard-grid">
        <div class="card">
          <div class="panel-head">
            <div>
              <h2>Protected revenue</h2>
              <p>Approved change orders over the last six months</p>
            </div>
            <span class="badge status-approved">Recovered</span>
          </div>
          <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
        </div>

        <div class="card quick-card">
          <div class="quick-logo">⚡</div>
          <h2>The 60-second boundary.</h2>
          <p>Paste the message. Price the impact. Send a polished change order while the request is still fresh.</p>
          <button class="btn primary" style="width:100%" onclick="App.openRequestModal()">Create change order</button>
          <div class="quick-list">
            <div class="quick-item"><span class="check">✓</span> Scope-risk detection</div>
            <div class="quick-item"><span class="check">✓</span> Rush and uncertainty pricing</div>
            <div class="quick-item"><span class="check">✓</span> Client-ready approval document</div>
          </div>
        </div>
      </section>

      <section class="card table-card">
        <div class="panel-head" style="padding-bottom:15px">
          <div><h2>Recent change orders</h2><p>Your latest scope decisions</p></div>
          <button class="btn small ghost" onclick="App.setView('requests')">View all →</button>
        </div>
        ${recent.length ? `
          <div class="table-scroll">
            <table>
              <thead><tr><th>Change</th><th>Project</th><th>Status</th><th>Value</th><th></th></tr></thead>
              <tbody>${recent.map(requestRow).join("")}</tbody>
            </table>
          </div>` : emptyState("No change orders yet","Analyze the next extra request instead of absorbing it.","App.openRequestModal()")}
      </section>`;
  }

  function kpi(label,value,note,icon,color){
    return `<div class="card kpi" style="--glow:${color}">
      <div class="kpi-label"><span>${label}</span><span class="kpi-icon">${icon}</span></div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-note">${note}</div>
    </div>`;
  }

  function requestRow(c){
    const p=getProject(c.projectId);
    return `<tr>
      <td>
        <div class="item-title">${esc(c.title)}</div>
        <div class="item-sub">${shortDate(c.created)} · ${esc(c.type||"Standard")}</div>
      </td>
      <td>
        <div>${esc(p?.name||"Deleted project")}</div>
        <div class="item-sub">${esc(p?.client||"")}</div>
      </td>
      <td><span class="badge status-${esc(c.status)}">${esc(c.status)}</span></td>
      <td class="amount">${money(changeAmount(c))}</td>
      <td>
        <div class="actions">
          <button class="btn small ghost" onclick="App.openDocument('${c.id}')">View</button>
          <button class="btn small" onclick="App.advanceStatus('${c.id}')">Next</button>
        </div>
      </td>
    </tr>`;
  }

  function renderRequests(){
    let changes=[...state.changes].sort((a,b)=>b.created.localeCompare(a.created));
    if(search){
      const q=search.toLowerCase();
      changes=changes.filter(c=>{
        const p=getProject(c.projectId);
        return [c.title,c.request,c.status,p?.name,p?.client].join(" ").toLowerCase().includes(q);
      });
    }
    if(statusFilter!=="all") changes=changes.filter(c=>c.status===statusFilter);

    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">Change-order pipeline</div>
          <h1>Extras become revenue.</h1>
          <p>${state.changes.length} requests documented across ${state.projects.length} projects.</p>
        </div>
        <button class="btn primary" onclick="App.openRequestModal()">＋ New change order</button>
      </div>

      <div class="card table-card">
        <div class="toolbar">
          <div class="search">
            <span>⌕</span>
            <input value="${esc(search)}" placeholder="Search changes, projects or clients…" oninput="App.searchRequests(this.value)">
          </div>
          <select style="width:150px" onchange="App.filterStatus(this.value)">
            ${["all","draft","sent","approved","paid","declined","waived"].map(s=>
              `<option value="${s}" ${statusFilter===s?"selected":""}>${s==="all"?"All statuses":title(s)}</option>`
            ).join("")}
          </select>
        </div>
        ${changes.length ? `
          <div class="table-scroll">
            <table>
              <thead>
                <tr><th>Change</th><th>Project</th><th>Status</th><th>Hours</th><th>Value</th><th></th></tr>
              </thead>
              <tbody>${changes.map(c=>{
                const p=getProject(c.projectId);
                return `<tr>
                  <td><div class="item-title">${esc(c.title)}</div><div class="item-sub">${shortDate(c.created)} · ${esc(c.type)}</div></td>
                  <td><div>${esc(p?.name||"Deleted project")}</div><div class="item-sub">${esc(p?.client||"")}</div></td>
                  <td>
                    <select style="width:116px;height:32px;padding:4px 8px" onchange="App.setStatus('${c.id}',this.value)">
                      ${["draft","sent","approved","paid","declined","waived"].map(s=>`<option value="${s}" ${c.status===s?"selected":""}>${title(s)}</option>`).join("")}
                    </select>
                  </td>
                  <td>${Number(c.hours)}h</td>
                  <td class="amount">${money(changeAmount(c))}</td>
                  <td><div class="actions">
                    <button class="btn small ghost" onclick="App.openDocument('${c.id}')">Open</button>
                    <button class="btn small danger ghost" onclick="App.deleteChange('${c.id}')">×</button>
                  </div></td>
                </tr>`;
              }).join("")}</tbody>
            </table>
          </div>` :
          emptyState("Nothing matches","Try another search or create a new change order.","App.openRequestModal()")}
      </div>`;
  }

  function renderProjects(){
    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">Project baselines</div>
          <h1>Clarity before delivery.</h1>
          <p>Your original scope is the reference point for every new request.</p>
        </div>
        <button class="btn primary" onclick="App.openProjectModal()">＋ Add project</button>
      </div>

      ${state.projects.length ? `<div class="projects-grid">
        ${state.projects.map((p,index)=>{
          const changes=state.changes.filter(c=>c.projectId===p.id);
          const recovered=changes.filter(c=>["approved","paid"].includes(c.status)).reduce((s,c)=>s+changeAmount(c),0);
          return `<article class="card project-card">
            <div class="project-top">
              <div class="project-avatar" style="--project-color:${p.color||PALETTE[index%PALETTE.length]}">${esc(initials(p.client))}</div>
              <button class="btn small ghost" onclick="App.openProjectModal('${p.id}')">Edit</button>
            </div>
            <h3>${esc(p.name)}</h3>
            <div class="client">${esc(p.client)} · Due ${shortDate(p.deadline)}</div>
            <div class="project-stats">
              <div class="mini-stat"><span>Original fee</span><strong>${money(p.budget)}</strong></div>
              <div class="mini-stat"><span>Recovered</span><strong class="up">${money(recovered)}</strong></div>
              <div class="mini-stat"><span>Rate</span><strong>${money(p.rate)}/h</strong></div>
              <div class="mini-stat"><span>Changes</span><strong>${changes.length}</strong></div>
            </div>
            <div class="scope-preview">${esc(p.scope)}</div>
            <div class="project-footer">
              <button class="btn small primary" style="flex:1" onclick="App.openRequestModal('${p.id}')">Analyze request</button>
              <button class="btn small danger ghost" onclick="App.deleteProject('${p.id}')">Delete</button>
            </div>
          </article>`;
        }).join("")}
      </div>` : emptyState("Create your first baseline","Add the agreed scope, fee, rate and revision limit.","App.openProjectModal()")}`;
  }

  function renderSettings(){
    const s=state.settings;
    return `
      <div class="page-head">
        <div>
          <div class="eyebrow">Workspace configuration</div>
          <h1>Make it yours.</h1>
          <p>These details appear on generated change orders.</p>
        </div>
      </div>

      <div class="settings-grid">
        <form class="card settings-card" onsubmit="App.saveSettings(event)">
          <h2>Business profile</h2>
          <p>Used for pricing, emails and documents.</p>
          <div class="form-grid">
            <div class="field"><label>BUSINESS NAME</label><input name="business" required value="${esc(s.business)}"></div>
            <div class="field"><label>YOUR NAME</label><input name="owner" required value="${esc(s.owner)}"></div>
            <div class="field full"><label>EMAIL</label><input name="email" type="email" value="${esc(s.email)}"></div>
            <div class="field">
              <label>CURRENCY</label>
              <select name="currency">
                ${["USD","EUR","GBP","CAD","AUD","NZD","INR","SGD"].map(c=>`<option ${s.currency===c?"selected":""}>${c}</option>`).join("")}
              </select>
            </div>
            <div class="field"><label>DEFAULT HOURLY RATE</label><input name="defaultRate" type="number" min="1" value="${Number(s.defaultRate)}"></div>
            <div class="field full"><label>DEFAULT UNCERTAINTY BUFFER (%)</label><input name="defaultBuffer" type="number" min="0" max="100" value="${Number(s.defaultBuffer)}"></div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:20px">
            <button class="btn primary">Save settings</button>
          </div>
        </form>

        <div style="display:grid;gap:18px">
          <div class="card settings-card">
            <h2>Data portability</h2>
            <p>Everything is stored in this browser.</p>
            <div style="display:grid;gap:9px">
              <button class="btn" onclick="App.exportData()">⇩ Export JSON backup</button>
              <button class="btn ghost" onclick="document.getElementById('importFile').click()">⇧ Import backup</button>
            </div>
          </div>

          <div class="card settings-card danger-zone">
            <h2>Reset workspace</h2>
            <p>Restore the demonstration projects and orders.</p>
            <button class="btn danger ghost" style="width:100%" onclick="App.resetDemo()">Reset demo data</button>
          </div>
        </div>
      </div>`;
  }

  function emptyState(titleText,body,action){
    return `<div class="empty">
      <div class="empty-icon">◇</div>
      <h3>${titleText}</h3>
      <p>${body}</p>
      <button class="btn primary" onclick="${action}">Get started</button>
    </div>`;
  }

  function title(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function initials(name=""){return name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"PR"}

  function openProjectModal(id){
    const project=id?getProject(id):null;
    document.getElementById("modalRoot").innerHTML=`
      <div class="modal-backdrop" onclick="App.backdropClose(event)">
        <div class="modal">
          <div class="modal-head">
            <h2>${project?"Edit project":"Create a scope baseline"}</h2>
            <button class="btn icon-btn ghost" onclick="App.closeModal()">×</button>
          </div>
          <form onsubmit="App.saveProject(event,'${project?.id||""}')">
            <div class="modal-body">
              <div class="form-grid">
                <div class="field"><label>PROJECT NAME</label><input name="name" required placeholder="Website redesign" value="${esc(project?.name||"")}"></div>
                <div class="field"><label>CLIENT / COMPANY</label><input name="client" required placeholder="Acme Inc." value="${esc(project?.client||"")}"></div>
                <div class="field full"><label>CLIENT EMAIL</label><input name="email" type="email" placeholder="client@example.com" value="${esc(project?.email||"")}"></div>
                <div class="field"><label>ORIGINAL PROJECT FEE</label><input name="budget" required type="number" min="0" value="${project?.budget||""}"></div>
                <div class="field"><label>BILLABLE RATE</label><input name="rate" required type="number" min="1" value="${project?.rate||state.settings.defaultRate}"></div>
                <div class="field"><label>DEADLINE</label><input name="deadline" type="date" value="${project?.deadline||dateOffset(30)}"></div>
                <div class="field"><label>INCLUDED REVISION ROUNDS</label><input name="revisions" type="number" min="0" value="${project?.revisions??2}"></div>
                <div class="field full">
                  <label>AGREED SCOPE</label>
                  <textarea name="scope" required placeholder="List deliverables, limits, included revisions, platforms and exclusions…">${esc(project?.scope||"")}</textarea>
                  <div class="hint">Specific nouns and deliverables improve request analysis.</div>
                </div>
              </div>
            </div>
            <div class="modal-foot">
              <button type="button" class="btn ghost" onclick="App.closeModal()">Cancel</button>
              <button class="btn primary">${project?"Save changes":"Create project"}</button>
            </div>
          </form>
        </div>
      </div>`;
  }

  function saveProject(event,id){
    event.preventDefault();
    const f=new FormData(event.target);
    const existing=id?getProject(id):null;
    const project={
      id:id||uid("p"),
      name:f.get("name").trim(),
      client:f.get("client").trim(),
      email:f.get("email").trim(),
      budget:Number(f.get("budget")),
      rate:Number(f.get("rate")),
      deadline:f.get("deadline"),
      revisions:Number(f.get("revisions")),
      scope:f.get("scope").trim(),
      created:existing?.created||today(),
      color:existing?.color||PALETTE[state.projects.length%PALETTE.length]
    };
    if(existing) Object.assign(existing,project);
    else state.projects.push(project);
    save();
    closeModal();
    render();
    toast(existing?"Project updated":"Scope baseline created");
  }

  function openRequestModal(projectId=""){
    if(!state.projects.length){
      toast("Create a project baseline first");
      openProjectModal();
      return;
    }
    const selected=getProject(projectId)||state.projects[0];
    document.getElementById("modalRoot").innerHTML=`
      <div class="modal-backdrop" onclick="App.backdropClose(event)">

  function analyze(text,project){
    const lower=text.toLowerCase();
    const patterns=[
      ["quick","Minimizes effort"],
      ["small","Minimizes effort"],
      ["just","Minimizes effort"],
      ["also","Additional deliverable"],
      ["add","Additional deliverable"],
      ["another","Additional deliverable"],
      ["one more","Revision expansion"],
      ["revision","Revision request"],
      ["redesign","Design expansion"],
      ["integrat","Technical integration"],
      ["portal","New product surface"],
      ["dashboard","New product surface"],
      ["urgent","Deadline pressure"],
      ["asap","Deadline pressure"],
      ["before launch","Deadline pressure"],
      ["ideally","Schedule pressure"],
      ["password","Security requirement"],
      ["upload","Storage requirement"],
      ["video","New media format"]
    ];
    const flags=[];
    patterns.forEach(([term,label])=>{
      if(lower.includes(term)&&!flags.includes(label)) flags.push(label);
    });

    const stop=new Set(["the","and","for","with","this","that","from","into","your","could","would","please","have","what","when","also","just"]);
    const words=s=>new Set((s.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!stop.has(w)));
    const requestWords=words(text);
    const scopeWords=words(project?.scope||"");
    const overlap=[...requestWords].filter(w=>scopeWords.has(w)).length;
    const similarity=requestWords.size ? overlap/requestWords.size : 1;

    let score=15+flags.length*9;
    if(text.length>80) score+=8;
    if(similarity<.15&&text.length>15) score+=22;
    score=Math.max(8,Math.min(96,score));
    return {score,flags,similarity};
  }

  function refreshAnalysis(first=false){
    const projectEl=document.getElementById("requestProject");
    if(!projectEl) return;
    const p=getProject(projectEl.value);
    if(first||document.activeElement===projectEl){
      document.getElementById("reqRate").value=p.rate;
    }
    const text=document.getElementById("requestText").value;
    const hours=Number(document.getElementById("reqHours").value)||0;
    const rate=Number(document.getElementById("reqRate").value)||0;
    const buffer=Number(document.getElementById("reqBuffer").value)||0;
    const rush=Number(document.getElementById("reqRush").value)||0;
    const labor=hours*rate;
    const uncertainty=labor*buffer/100;
    const rushCost=(labor+uncertainty)*rush/100;
    const quote=Math.ceil((labor+uncertainty+rushCost)/25)*25;
    const result=analyze(text,p);
    const level=result.score>70?"High risk":result.score>40?"Review needed":"Low risk";
    const color=result.score>70?"#ff6b6b":result.score>40?"#ffb454":"#b8ff5a";

    document.getElementById("analysisPanel").innerHTML=`
      <aside class="analysis">
        <div class="analysis-score">
          <div class="risk-label"><strong>${level}</strong><span>Scope expansion score</span></div>
          <div class="risk-ring" style="--score:${result.score};--ring-color:${color}"><strong>${result.score}</strong></div>
        </div>
        <div class="flags">
          ${result.flags.length?result.flags.map(f=>`<span class="flag">${esc(f)}</span>`).join(""):`<span class="flag" style="color:var(--muted);border-color:var(--line);background:transparent">Add message to detect risks</span>`}
        </div>
        <div class="quote-box">
          <div class="quote-row"><span>Base labor</span><strong>${money(labor)}</strong></div>
          <div class="quote-row"><span>Uncertainty buffer</span><strong>${money(uncertainty)}</strong></div>
          <div class="quote-row"><span>Rush premium</span><strong>${money(rushCost)}</strong></div>
          <div class="quote-total"><span>Recommended fee</span><strong>${money(quote)}</strong></div>
        </div>
        <div class="hint" style="margin-top:14px">
          Original scope overlap: ${Math.round(result.similarity*100)}%. This is a heuristic review, not legal or contractual advice.
        </div>
      </aside>`;
  }

  function saveRequest(event){
    event.preventDefault();
    const f=new FormData(event.target);
    const raw=Number(f.get("hours"))*Number(f.get("rate"))*
      (1+Number(f.get("buffer"))/100)*(1+Number(f.get("rush"))/100);
    const change={
      id:uid("c"),
      projectId:f.get("projectId"),
      title:f.get("title").trim(),
      request:f.get("request").trim(),
      hours:Number(f.get("hours")),
      rate:Number(f.get("rate")),
      buffer:Number(f.get("buffer")),
      rush:Number(f.get("rush")),
      timeline:Number(f.get("timeline")),
      type:f.get("type"),
      amount:Math.ceil(raw/25)*25,
      status:"draft",
      created:today()
    };
    state.changes.push(change);
    save();
    closeModal();
    render();
    toast("Change order created");
    setTimeout(()=>openDocument(change.id),150);
  }

      : p.deadline;

    document.getElementById("modalRoot").innerHTML=`
      <div class="modal-backdrop" onclick="App.backdropClose(event)">
        <div class="modal wide">
          <div class="modal-head">
            <h2>${reference} · ${esc(c.title)}</h2>
            <button class="btn icon-btn ghost" onclick="App.closeModal()">×</button>
          </div>
          <div class="doc-wrap">
            <article class="document" id="printDocument">
              <header class="doc-head">
                <div class="doc-brand">SOW<span>Guard</span></div>
                <div class="doc-meta">

                  Status: ${title(c.status)}

              </header>

              <h1>Change Order</h1>
              <div class="doc-sub">
                ${esc(p.name)} · Prepared by ${esc(state.settings.business)} for ${esc(p.client)}
              </div>

                <p>${esc(c.request)}</p>

              <section class="doc-section">
                <h3>Impact assessment</h3>

                  <div><span>Estimated effort</span><strong>${Number(c.hours)} hours</strong></div>
                  <div><span>Schedule impact</span><strong>+${Number(c.timeline)||0} days</strong></div>
                  <div><span>Revised deadline</span><strong>${shortDate(newDeadline)}</strong></div>

              <div class="signatures">

  function emailText(c,p){
    return `Hi ${p.client},

Thanks for sending the request regarding “${c.title}.”

I reviewed it against the agreed scope for ${p.name}. It adds approximately ${c.hours} hours of work and may move the delivery timeline by ${c.timeline||0} day(s).

The change-order fee is ${money(changeAmount(c))}.

Once you approve the adjustment in writing, I’ll add it to the production schedule. Until then, the original scope and deadline remain unchanged.

Best,
${state.settings.owner}
${state.settings.business}`;
  }

  async function copyEmail(id){
    const c=state.changes.find(x=>x.id===id),p=getProject(c.projectId);
    try{
      await navigator.clipboard.writeText(emailText(c,p));
      toast("Client email copied");
    }catch(e){
      toast("Clipboard permission was unavailable");
    }
  }

  function emailClient(id){
    const c=state.changes.find(x=>x.id===id),p=getProject(c.projectId);
    c.status="sent";
    save();
    const subject=encodeURIComponent(`Change order: ${c.title} — ${p.name}`);
    const body=encodeURIComponent(emailText(c,p));
    location.href=`mailto:${encodeURIComponent(p.email||"")}?subject=${subject}&body=${body}`;
    toast("Marked as sent");
  }

  function advanceStatus(id){
    const c=state.changes.find(x=>x.id===id);
    const flow=["draft","sent","approved","paid"];
    const i=flow.indexOf(c.status);
    c.status=flow[Math.min(i+1,flow.length-1)]||"sent";
    save();render();toast("Status changed to "+title(c.status));
  }

  function setStatus(id,status){
    const c=state.changes.find(x=>x.id===id);
    if(c){c.status=status;save();render();toast("Status updated")}
  }

  function deleteChange(id){
    if(!confirm("Delete this change order?")) return;
    state.changes=state.changes.filter(c=>c.id!==id);
    save();closeModal();render();toast("Change order deleted");
  }

  function deleteProject(id){
    const related=state.changes.filter(c=>c.projectId===id).length;
    if(!confirm(`Delete this project${related?` and its ${related} change order(s)`:""}?`)) return;
    state.projects=state.projects.filter(p=>p.id!==id);
    state.changes=state.changes.filter(c=>c.projectId!==id);
    save();render();toast("Project deleted");
  }

  function searchRequests(value){search=value;render()}
  function filterStatus(value){statusFilter=value;render()}

  function saveSettings(event){
    event.preventDefault();
    const f=new FormData(event.target);
    state.settings={
      ...state.settings,
      business:f.get("business").trim(),
      owner:f.get("owner").trim(),
      email:f.get("email").trim(),
      currency:f.get("currency"),
      defaultRate:Number(f.get("defaultRate")),
      defaultBuffer:Number(f.get("defaultBuffer"))
    };
    save();render();toast("Settings saved");
  }

  function toggleTheme(){
    state.settings.theme=state.settings.theme==="light"?"dark":"light";
    save();
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`sowguard-backup-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup exported");
  }

  async function importData(file){
    if(!file) return;
    try{
      const parsed=JSON.parse(await file.text());
      if(!parsed.settings||!Array.isArray(parsed.projects)||!Array.isArray(parsed.changes)) throw new Error();
      state=parsed;
      save();render();toast("Backup imported");
    }catch(e){
      alert("That file is not a valid SOWGuard backup.");
    }
  }

  function resetDemo(){
    if(!confirm("Replace all current data with demonstration data?")) return;
    state=demoState();
    save();render();toast("Demo workspace restored");
  }

  function drawChart(){
    const canvas=document.getElementById("revenueChart");
    if(!canvas) return;
    const rect=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    const ctx=canvas.getContext("2d");
    ctx.scale(dpr,dpr);

    const width=rect.width,height=rect.height;
    const now=new Date();
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({
        key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,
        label:d.toLocaleDateString(undefined,{month:"short"}),
        value:0
      });
    }
    state.changes.filter(c=>["approved","paid"].includes(c.status)).forEach(c=>{
      const m=months.find(x=>c.created.startsWith(x.key));
      if(m)m.value+=changeAmount(c);
    });

    const style=getComputedStyle(document.documentElement);
    const line=style.getPropertyValue("--line").trim();
    const muted=style.getPropertyValue("--muted").trim();
    const accent=style.getPropertyValue("--accent").trim();
    const pad={l:42,r:18,t:15,b:35};
    const chartW=width-pad.l-pad.r,chartH=height-pad.t-pad.b;
    const max=Math.max(...months.map(m=>m.value),1000)*1.18;

    ctx.clearRect(0,0,width,height);
    ctx.font="10px Inter, sans-serif";
    ctx.fillStyle=muted;
    ctx.strokeStyle=line;
    ctx.lineWidth=1;

    for(let i=0;i<4;i++){
      const y=pad.t+(chartH/3)*i;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(width-pad.r,y);ctx.stroke();
      const val=Math.round(max-(max/3)*i);
      ctx.fillText(val>=1000?(val/1000).toFixed(1)+"k":val,pad.l-35,y+3);
    }

    const points=months.map((m,i)=>({
      x:pad.l+(chartW/(months.length-1))*i,
      y:pad.t+chartH-(m.value/max)*chartH
    }));

    const gradient=ctx.createLinearGradient(0,pad.t,0,height-pad.b);
    gradient.addColorStop(0,"rgba(184,255,90,.28)");
    gradient.addColorStop(1,"rgba(184,255,90,0)");
    ctx.beginPath();
    ctx.moveTo(points[0].x,height-pad.b);
    points.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(points.at(-1).x,height-pad.b);
    ctx.closePath();ctx.fillStyle=gradient;ctx.fill();

    ctx.beginPath();
    points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.strokeStyle=accent;ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.stroke();

    points.forEach((p,i)=>{
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fillStyle=accent;ctx.fill();
      ctx.fillStyle=muted;
      ctx.textAlign="center";
      ctx.fillText(months[i].label,p.x,height-9);
    });
    ctx.textAlign="left";
  }

  function closeModal(){document.getElementById("modalRoot").innerHTML=""}
  function backdropClose(e){if(e.target.classList.contains("modal-backdrop"))closeModal()}
  function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
  function toast(message){
    const wrap=document.getElementById("toastWrap");
    const el=document.createElement("div");
    el.className="toast";
    el.innerHTML=`<span class="toast-dot"></span>${esc(message)}`;
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),2800);
  }

  document.getElementById("importFile").addEventListener("change",e=>{
    importData(e.target.files[0]);
    e.target.value="";
  });
  window.addEventListener("resize",()=>{if(view==="dashboard")drawChart()});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape")closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
      e.preventDefault();openRequestModal();
    }
  });

  updateTheme();
  render();

  return {
    setView,openProjectModal,saveProject,openRequestModal,refreshAnalysis,
    saveRequest,openDocument,closeModal,backdropClose,toggleSidebar,toggleTheme,
    advanceStatus,setStatus,deleteChange,deleteProject,searchRequests,filterStatus,
    saveSettings,exportData,resetDemo,copyEmail,emailClient
  };
})();
</script>
