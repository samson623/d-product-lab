<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BidLens commercial cleaning bid calculator and proposal generator">
<title>BidLens — Commercial Cleaning Bid Calculator</title>

<style>
:root {
  color-scheme: dark;

  --bg: #080b0f;
  --surface: #0f141a;
  --surface-2: #151b23;
  --surface-3: #1b232d;
  --border: rgba(255,255,255,.09);

  --text: #f4f7f9;
  --muted: #96a1ad;
  --subtle: #6d7885;

  --green: #5ee0a0;
  --green-2: #20b978;
  --blue: #6fa9ff;
  --orange: #ffb45c;
  --red: #ff7085;

  --shadow: 0 24px 80px rgba(0,0,0,.36);
  --radius: 17px;
}

body.light {
  color-scheme: light;

  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #f6f8f8;
  --surface-3: #edf1f1;
  --border: rgba(14,30,31,.11);

  --text: #102020;
  --muted: #657474;
  --subtle: #869292;

  --shadow: 0 22px 60px rgba(27,52,53,.11);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 85% -10%, rgba(94,224,160,.14), transparent 34rem),
    radial-gradient(circle at 10% 25%, rgba(111,169,255,.07), transparent 26rem),
    var(--bg);
  font-family:
    Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  font-size: 14px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
select {
  cursor: pointer;
}

button {
  color: inherit;
}

::selection {
  color: #06120d;
  background: var(--green);
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: rgba(130,145,150,.35);
}

/* Layout */

.shell {
  display: grid;
  grid-template-columns: 245px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 22px 15px;
  border-right: 1px solid var(--border);
  background: rgba(9,13,17,.9);
  backdrop-filter: blur(20px);
  z-index: 50;
}

.light .sidebar {
  background: rgba(255,255,255,.88);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 8px 23px;
}

.logo-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  color: #06120d;
  background: linear-gradient(135deg, var(--green), #a6ffd0);
  box-shadow: 0 12px 32px rgba(94,224,160,.24);
  font-size: 19px;
  font-weight: 950;
}

.logo strong {
  display: block;
  font-size: 18px;
  letter-spacing: -.04em;
}

.logo small {
  color: var(--muted);
}

.navigation {
  display: grid;
  gap: 6px;
}

.navigation button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 11px;
  color: var(--muted);
  background: transparent;
  text-align: left;
  transition: .16s ease;
}

.navigation button:hover {
  color: var(--text);
  background: var(--surface-2);
}

.navigation button.active {
  color: var(--text);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border);
}

.nav-icon {
  width: 19px;
  text-align: center;
}

.sidebar-spacer {
  flex: 1;
}

.privacy-box {
  padding: 13px;
  margin: 18px 0 12px;
  border: 1px solid rgba(94,224,160,.2);
  border-radius: 13px;
  color: var(--muted);
  background: rgba(94,224,160,.06);
  font-size: 12px;
  line-height: 1.5;
}

.privacy-box strong {
  display: block;
  margin-bottom: 4px;
  color: var(--green);
}

.side-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.main {
  min-width: 0;
  padding: 28px clamp(18px,4vw,50px) 70px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: 26px;
}

.eyebrow {
  display: block;
  margin-bottom: 7px;
  color: var(--green);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .14em;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 7px;
  font-size: clamp(29px,4vw,44px);
  line-height: 1.02;
  letter-spacing: -.06em;
}

h2 {
  margin-bottom: 6px;
  font-size: 21px;
  letter-spacing: -.035em;
}

h3 {
  margin-bottom: 5px;
  font-size: 15px;
  letter-spacing: -.015em;
}

.subtitle,
.muted {
  color: var(--muted);
}

.top-actions,
.toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

/* Reusable UI */

.view {
  display: none;
  animation: appear .2s ease;
}

.view.active {
  display: block;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.card {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent),
    var(--surface);
  box-shadow: var(--shadow);
}

.section {
  margin-bottom: 17px;
  scroll-margin-top: 20px;
}

.section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 17px;
}

.grid {
  display: grid;
  gap: 15px;
}

.grid-2 {
  grid-template-columns: repeat(2,minmax(0,1fr));
}

.grid-3 {
  grid-template-columns: repeat(3,minmax(0,1fr));
}

.grid-4 {
  grid-template-columns: repeat(4,minmax(0,1fr));
}

.estimator-layout {
  display: grid;
  grid-template-columns: minmax(0,1.45fr) minmax(310px,.55fr);
  gap: 17px;
  align-items: start;
}

.sticky-column {
  position: sticky;
  top: 20px;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 39px;
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  background: var(--surface-2);
  font-weight: 750;
  text-decoration: none;
  transition: transform .15s, border-color .15s, background .15s;
}

.btn:hover {
  transform: translateY(-1px);
  border-color: rgba(94,224,160,.42);
}

.btn.primary {
  color: #07120d;
  border-color: transparent;
  background: linear-gradient(135deg, var(--green), #8df0bb);
  box-shadow: 0 10px 30px rgba(94,224,160,.18);
}

.btn.danger {
  color: var(--red);
  border-color: rgba(255,112,133,.22);
  background: rgba(255,112,133,.07);
}

.btn.small {
  min-height: 33px;
  padding: 6px 10px;
  font-size: 12px;
}

.btn.icon {
  width: 39px;
  padding: 0;
}

.mobile-menu {
  display: none;
}

label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}

input,
select,
textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  color: var(--text);
  background: var(--surface-2);
  transition: border-color .15s, box-shadow .15s;
}

textarea {
  min-height: 95px;
  resize: vertical;
  line-height: 1.5;
}

input:focus,
select:focus,
textarea:focus {
  border-color: rgba(94,224,160,.65);
  box-shadow: 0 0 0 3px rgba(94,224,160,.09);
}

.input-with-suffix {
  position: relative;
}

.input-with-suffix input {
  padding-right: 45px;
}

.input-with-suffix span {
  position: absolute;
  top: 10px;
  right: 11px;
  color: var(--subtle);
  pointer-events: none;
  font-size: 12px;
}

.help {
  margin: 6px 0 0;
  color: var(--subtle);
  font-size: 11px;
  line-height: 1.45;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-radius: 999px;
  color: var(--muted);
  background: var(--surface-3);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.badge.good {
  color: var(--green);
  background: rgba(94,224,160,.09);
}

.badge.warn {
  color: var(--orange);
  background: rgba(255,180,92,.09);
}

.badge.bad {
  color: var(--red);
  background: rgba(255,112,133,.09);
}

.notice {
  padding: 13px 14px;
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  color: var(--muted);
  background: rgba(111,169,255,.07);
  line-height: 1.5;
}

.notice.warning {
  border-color: var(--orange);
  background: rgba(255,180,92,.07);
}

.notice.danger {
  border-color: var(--red);
  background: rgba(255,112,133,.07);
}

.divider {
  height: 1px;
  margin: 18px 0;
  background: var(--border);
}

/* Zones and tables */

.table-wrap {
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}

.data-table th {
  padding: 0 7px 9px;
  color: var(--subtle);
  font-size: 10px;
  letter-spacing: .08em;
  text-align: left;
  text-transform: uppercase;
}

.data-table td {
  padding: 7px;
  border-top: 1px solid var(--border);
  vertical-align: middle;
}

.data-table td:first-child,
.data-table th:first-child {
  padding-left: 0;
}

.data-table td:last-child,
.data-table th:last-child {
  padding-right: 0;
}

.data-table input,
.data-table select {
  min-width: 90px;
}

.zone-hours {
  color: var(--green);
  font-weight: 850;
  white-space: nowrap;
}

.empty {
  padding: 35px 18px;
  border: 1px dashed var(--border);
  border-radius: 13px;
  color: var(--muted);
  text-align: center;
}

.empty-icon {
  display: block;
  margin-bottom: 9px;
  font-size: 28px;
}

/* Financial results */

.hero-price {
  padding: 19px;
  margin-bottom: 13px;
  border: 1px solid rgba(94,224,160,.2);
  border-radius: 15px;
  background:
    radial-gradient(circle at 100% 0%, rgba(94,224,160,.15), transparent 16rem),
    var(--surface-2);
}

.hero-price small {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-weight: 750;
}

.hero-price strong {
  display: block;
  font-size: 38px;
  line-height: 1;
  letter-spacing: -.06em;
}

.hero-price p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.metric-list {
  display: grid;
  gap: 0;
}

.metric {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.metric:last-child {
  border-bottom: 0;
}

.metric span {
  color: var(--muted);
}

.metric strong {
  text-align: right;
}

.scenarios {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 14px;
}

.scenario {
  padding: 11px 7px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  text-align: center;
}

.scenario span {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
}

.scenario strong {
  font-size: 13px;
}

.health-meter {
  height: 8px;
  margin: 13px 0 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--surface-3);
}

.health-meter span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--red), var(--orange), var(--green));
}

/* Saved bids */

.saved-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 14px;
}

.saved-card {
  position: relative;
  transition: transform .15s, border-color .15s;
}

.saved-card:hover {
  transform: translateY(-2px);
  border-color: rgba(94,224,160,.32);
}

.saved-card .price {
  display: block;
  margin: 16px 0 5px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.05em;
}

.saved-card .meta {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.saved-actions {
  display: flex;
  gap: 7px;
  margin-top: 15px;
}

/* Proposal */

.proposal-page {
  max-width: 900px;
  margin: 0 auto;
  color: var(--text);
}

.proposal-cover {
  position: relative;
  min-height: 380px;
  padding: 52px;
  overflow: hidden;
}

.proposal-cover::after {
  content: "";
  position: absolute;
  right: -80px;
  bottom: -120px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: rgba(94,224,160,.1);
}

.proposal-company {
  color: var(--green);
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.proposal-title {
  max-width: 600px;
  margin-top: 80px;
  font-size: clamp(38px,7vw,68px);
  line-height: .98;
  letter-spacing: -.07em;
}

.proposal-for {
  margin-top: 28px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.65;
}

.proposal-section {
  margin-top: 16px;
  padding: 30px;
}

.proposal-section p,
.proposal-section li {
  color: var(--muted);
  line-height: 1.65;
}

.proposal-section ul {
  padding-left: 19px;
}

.price-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 22px;
  padding: 22px;
  border: 1px solid rgba(94,224,160,.24);
  border-radius: 14px;
  background: rgba(94,224,160,.055);
}

.price-box strong {
  display: block;
  font-size: 31px;
  letter-spacing: -.05em;
}

.proposal-table {
  width: 100%;
  border-collapse: collapse;
}

.proposal-table th,
.proposal-table td {
  padding: 12px 9px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.proposal-table th:last-child,
.proposal-table td:last-child {
  text-align: right;
}

.signature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-top: 45px;
}

.signature-line {
  padding-top: 40px;
  border-bottom: 1px solid var(--muted);
}

.signature-label {
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
}

/* Toast */

.toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  max-width: 360px;
  padding: 13px 16px;
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  background: var(--surface);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: .2s;
  z-index: 200;
}

.toast.show {
  opacity: 1;
  transform: none;
}

/* Responsive */

@media (max-width: 1100px) {
  .grid-4 {
    grid-template-columns: repeat(2,1fr);
  }

  .saved-grid {
    grid-template-columns: repeat(2,1fr);
  }
}

@media (max-width: 930px) {
  .estimator-layout {
    display: block;
  }

  .sticky-column {
    position: static;
    margin-top: 17px;
  }
}

@media (max-width: 760px) {
  .shell {
    display: block;
  }

  .sidebar {
    position: fixed;
    left: 0;
    width: 270px;
    transform: translateX(-105%);
    transition: transform .2s;
    box-shadow: var(--shadow);
  }

  .sidebar.open {
    transform: none;
  }

  .main {
    padding: 20px 15px 55px;
  }

  .topbar {
    flex-direction: column;
  }

  .top-actions {
    justify-content: flex-start;
  }

  .mobile-menu {
    display: inline-flex;
  }

  .saved-grid,
  .grid-3 {
    grid-template-columns: 1fr;
  }

  .proposal-cover {
    min-height: 320px;
    padding: 28px;
  }

  .proposal-title {
    margin-top: 60px;
  }
}

@media (max-width: 540px) {
  .grid-2,
  .grid-4 {
    grid-template-columns: 1fr;
  }

  .scenarios {
    grid-template-columns: 1fr;
  }

  .signature-grid {
    grid-template-columns: 1fr;
  }

  .price-box {
    align-items: flex-start;
    flex-direction: column;
  }
}

/* Client proposal printing */

@media print {
  @page {
    size: letter;
    margin: .55in;
  }

  body,
  body.light {
    color: #172222 !important;
    background: white !important;
  }

  .sidebar,
  .topbar,
  .no-print,
  .toast,
  #estimatorView,
  #savedView,
  #researchView {
    display: none !important;
  }

  .shell {
    display: block;
  }

  .main {
    padding: 0;
  }

  #proposalView {
    display: block !important;
  }

  .proposal-page {
    max-width: none;
  }

  .card {
    color: #172222;
    background: white !important;
    border-color: #dce4e1;
    box-shadow: none;
  }

  .proposal-cover {
    min-height: 8.7in;
    page-break-after: always;
  }

  .proposal-section {
    break-inside: avoid;
  }

  .proposal-section p,
  .proposal-section li,
  .muted {
    color: #536362 !important;
  }

  .proposal-company,
  .eyebrow {
    color: #168658 !important;
  }

  .proposal-table th,
  .proposal-table td {
    border-color: #dce4e1;
  }
}
</style>
</head>

<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">B</div>
      <div>
        <strong>BidLens</strong>
        <small>Profit-first bidding</small>
      </div>
    </div>

    <nav class="navigation">
      <button class="active" data-view="estimator">
        <span class="nav-icon">⌁</span>
        Bid estimator
      </button>

      <button data-view="proposal">
        <span class="nav-icon">▤</span>
        Client proposal
      </button>

      <button data-view="saved">
        <span class="nav-icon">▣</span>
        Saved bids
      </button>

      <button data-view="research">
        <span class="nav-icon">◎</span>
        Pricing guide
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="privacy-box">
      <strong>● Local-first</strong>
      Bid and customer data stays in this browser. Export a backup before clearing browser storage.
    </div>

    <div class="side-actions">
      <button class="btn small" id="themeButton">◐ Theme</button>
      <button class="btn small" id="backupButton">⇩ Backup</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar no-print">
      <div>
        <span class="eyebrow" id="pageEyebrow">Profit-first estimating</span>
        <h1 id="pageTitle">Price the work, not the guess.</h1>
        <p class="subtitle" id="pageSubtitle">
          Build a profitable commercial-cleaning bid from labor, workload, overhead, and scope.
        </p>
      </div>

      <div class="top-actions">
        <button class="btn icon mobile-menu" id="menuButton" aria-label="Open navigation">☰</button>
        <button class="btn" id="newButton">＋ New</button>
        <button class="btn" id="importButton">⇧ Import</button>
        <button class="btn primary" id="saveButton">Save bid</button>
      </div>
    </header>

    <section class="view active" id="estimatorView"></section>
    <section class="view" id="proposalView"></section>
    <section class="view" id="savedView"></section>
    <section class="view" id="researchView"></section>
  </main>
</div>

<input type="file" id="importFile" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "bidlens_saved_bids_v1";
  const DRAFT_KEY = "bidlens_draft_v1";
  const THEME_KEY = "bidlens_theme_v1";
  const MONTHLY_WEEKS = 52 / 12;

  /*
    These are editable starter assumptions, not claimed ISSA standards.
    Every contractor should replace them with observed production data.
  */
  const ZONE_TYPES = {
    office: {
      label: "General office",
      rate: 4500,
      tasks: "Empty waste, dust accessible surfaces, spot clean, vacuum or mop floors."
    },
    restroom: {
      label: "Restrooms",

  function calculate(model = state) {
    const visitsPerWeek = Math.max(numeric(model.facility.visitsPerWeek), 0);
    const monthlyVisits = visitsPerWeek * MONTHLY_WEEKS;

    const totalSquareFeet = model.zones.reduce(
      (sum, zone) => sum + Math.max(numeric(zone.squareFeet), 0),
      0
    );

    const hoursPerVisit = model.zones.reduce((sum, zone) => {
      const squareFeet = Math.max(numeric(zone.squareFeet), 0);
      const productionRate = Math.max(numeric(zone.productionRate), 1);
      const fixedMinutes = Math.max(numeric(zone.fixedMinutes), 0);

      return sum + squareFeet / productionRate + fixedMinutes / 60;
    }, 0);

    const monthlyLaborHours = hoursPerVisit * monthlyVisits;

    const wage = Math.max(numeric(model.costs.hourlyWage), 0);
    const burdenRate = Math.max(numeric(model.costs.payrollBurdenPct), 0) / 100;
    const loadedHourlyCost = wage * (1 + burdenRate);
    const monthlyLaborCost = monthlyLaborHours * loadedHourlyCost;

    const travelCost =
      Math.max(numeric(model.costs.travelPerVisit), 0) * monthlyVisits;

    const suppliesCost = Math.max(numeric(model.costs.suppliesMonthly), 0);
    const equipmentCost = Math.max(numeric(model.costs.equipmentMonthly), 0);

    const recurringDirectCost =
      monthlyLaborCost + travelCost + suppliesCost + equipmentCost;

    const overheadRate =
      Math.max(numeric(model.costs.overheadPct), 0) / 100;

    const overheadCost = recurringDirectCost * overheadRate;
    const costBeforeContingency = recurringDirectCost + overheadCost;

    const contingencyRate =
      Math.max(numeric(model.costs.contingencyPct), 0) / 100;

    const contingencyCost = costBeforeContingency * contingencyRate;
    const baseMonthlyCost = costBeforeContingency + contingencyCost;

    const targetMarginRate = clamp(
      numeric(model.costs.targetMarginPct) / 100,
      0,
      .95
    );

    /*
      Correct margin formula:
      price = cost / (1 - desired margin)

      Multiplying cost by 1.25 produces a 20% margin, not a 25% margin.
    */
    const baseMonthlyPrice =
      baseMonthlyCost / Math.max(1 - targetMarginRate, .05);

    const includedAddons = model.addons.filter(addon => addon.included);
    const addonRevenue = includedAddons.reduce(
      (sum, addon) => sum + Math.max(numeric(addon.monthlyPrice), 0),
      0
    );
    const addonCost = includedAddons.reduce(
      (sum, addon) => sum + Math.max(numeric(addon.monthlyCost), 0),
      0
    );

    const monthlyPrice = baseMonthlyPrice + addonRevenue;
    const monthlyCost = baseMonthlyCost + addonCost;
    const monthlyProfit = monthlyPrice - monthlyCost;

    const actualMarginRate =
      monthlyPrice > 0 ? monthlyProfit / monthlyPrice : 0;

    const laborPctOfRevenue =
      monthlyPrice > 0 ? monthlyLaborCost / monthlyPrice : 0;

    const perVisitPrice =
      monthlyVisits > 0 ? monthlyPrice / monthlyVisits : 0;

    const pricePerSquareFootPerVisit =
      totalSquareFeet > 0 && monthlyVisits > 0
        ? monthlyPrice / monthlyVisits / totalSquareFeet
        : 0;

    const annualRevenue = monthlyPrice * 12;
    const annualProfit = monthlyProfit * 12;

    return {
      visitsPerWeek,
      monthlyVisits,
      totalSquareFeet,
      hoursPerVisit,
      monthlyLaborHours,
      wage,
      loadedHourlyCost,
      monthlyLaborCost,
      travelCost,
      suppliesCost,
      equipmentCost,
      recurringDirectCost,
      overheadCost,
      contingencyCost,
      baseMonthlyCost,
      baseMonthlyPrice,
      addonRevenue,
      addonCost,
      monthlyPrice,
      monthlyCost,
      monthlyProfit,
      actualMarginRate,
      laborPctOfRevenue,
      perVisitPrice,
      pricePerSquareFootPerVisit,
      annualRevenue,
      annualProfit
    };
  }

  function priceAtMargin(result, percentage) {
    const rate = clamp(percentage / 100, 0, .95);
    return result.monthlyCost / Math.max(1 - rate, .05);

  function setPath(object, path, rawValue) {
    const parts = path.split(".");
    let target = object;

    for (let i = 0; i < parts.length - 1; i++) {
      target = target[parts[i]];
    }

    const last = parts[parts.length - 1];
    const existing = target[last];

    target[last] =
      typeof existing === "number"
        ? numeric(rawValue)
        : rawValue;
  }

  function bindEstimatorActions() {

    $$("[data-zone-field]").forEach(input => {
      input.addEventListener("change", event => {
        const zone = state.zones.find(
          item => item.id === event.target.dataset.zoneId
        );

        if (!zone) return;

        const field = event.target.dataset.zoneField;

        if (field === "type") {
          zone.type = event.target.value;
          zone.productionRate = ZONE_TYPES[zone.type].rate;

          if (!zone.name || Object.values(ZONE_TYPES).some(
            type => type.label === zone.name
          )) {
            zone.name = ZONE_TYPES[zone.type].label;
          }
        } else {
          zone[field] =
            typeof zone[field] === "number"
              ? numeric(event.target.value)
              : event.target.value;
        }

        persistDraft();
        renderEstimator();
      });
    });


    $$("[data-addon-field]").forEach(input => {
      input.addEventListener("change", event => {
        const addon = state.addons.find(
          item => item.id === event.target.dataset.addonId
        );

        if (!addon) return;

        const field = event.target.dataset.addonField;

        if (field === "included") {
          addon.included = event.target.checked;
        } else {
          addon[field] =
            typeof addon[field] === "number"
              ? numeric(event.target.value)
              : event.target.value;
        }

        persistDraft();
        renderEstimator();
      });
    });
  }

  function exportBackup() {
    const payload = {
      product: "BidLens",
      version: 1,
      exportedAt: new Date().toISOString(),
      draft: state,
      savedBids
    };

    const blob = new Blob(
      [JSON.stringify(payload, null, 2)],
      { type: "application/json" }
    );

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `bidlens-backup-${todayISO()}.json`;
    link.click();

    URL.revokeObjectURL(link.href);
    toast("Backup downloaded.");
  }

  async function importBackup(file) {
    try {
      const parsed = JSON.parse(await file.text());

      if (
        parsed.product === "BidLens" &&
        Array.isArray(parsed.savedBids)
      ) {
        if (!confirm("Replace the current draft and saved bids with this backup?")) {
          return;
        }

        state = normalizeState(parsed.draft || createDefaultState());
        savedBids = parsed.savedBids.map(normalizeState);

        persistDraft();
        persistSaved();
        showView("saved");
        toast("BidLens backup imported.");
        return;
      }

      if (parsed.id && parsed.client && parsed.costs) {
        state = normalizeState(parsed);
        persistDraft();
        showView("estimator");
        toast("Bid imported.");
        return;
      }

      throw new Error("Unsupported file");
    } catch {
      toast("Could not import this file. Select a valid BidLens JSON backup.");
    }
  }

        renderEstimator();
      }

      if (action === "add-addon") {
        state.addons.push({
          id: id(),
          name: "Additional service",
          monthlyPrice: 100,
          monthlyCost: 40,
          included: true
        });
        persistDraft();
        renderEstimator();
      }

      if (action === "view-proposal") showView("proposal");
      if (action === "edit-bid") showView("estimator");
      if (action === "save-bid") saveCurrentBid();
      if (action === "copy-summary") copySummary();
      if (action === "print-proposal") window.print();

      return;
    }

    const removeZone = event.target.closest("[data-remove-zone]");

    if (removeZone) {
      if (state.zones.length === 1) {
        toast("A bid needs at least one cleaning zone.");
        return;
      }

      state.zones = state.zones.filter(
        zone => zone.id !== removeZone.dataset.removeZone
      );

      persistDraft();
      renderEstimator();
      return;
    }

    const removeAddon = event.target.closest("[data-remove-addon]");

    if (removeAddon) {
      state.addons = state.addons.filter(
        addon => addon.id !== removeAddon.dataset.removeAddon
      );

      persistDraft();
      renderEstimator();
      return;
    }

    const openSaved = event.target.closest("[data-open-saved]");

    if (openSaved) {
      const bid = savedBids.find(item => item.id === openSaved.dataset.openSaved);

      if (bid) {
        state = normalizeState(clone(bid));
        persistDraft();
        showView("estimator");
        toast("Saved bid opened.");
      }
      return;
    }

    const duplicateSaved = event.target.closest("[data-duplicate-saved]");

    if (duplicateSaved) {
      const source = savedBids.find(
        item => item.id === duplicateSaved.dataset.duplicateSaved
      );

      if (source) {
        const copy = normalizeState(clone(source));
        copy.id = id();
        copy.client.company += " — Copy";
        copy.createdAt = new Date().toISOString();
        copy.updatedAt = copy.createdAt;

        savedBids.unshift(copy);
        persistSaved();
        renderSaved();
        toast("Bid duplicated.");
      }
      return;
    }

    const deleteSaved = event.target.closest("[data-delete-saved]");

    if (deleteSaved) {
      const bid = savedBids.find(
        item => item.id === deleteSaved.dataset.deleteSaved
      );

      if (
        bid &&
        confirm(`Delete the saved bid for ${bid.client.company}?`)
      ) {
        savedBids = savedBids.filter(
          item => item.id !== deleteSaved.dataset.deleteSaved
        );

        persistSaved();
        renderSaved();
        toast("Saved bid deleted.");
      }
    }
  });

  $("#saveButton").addEventListener("click", saveCurrentBid);
  $("#newButton").addEventListener("click", newBid);
  $("#backupButton").addEventListener("click", exportBackup);

  $("#importButton").addEventListener("click", () => {
    $("#importFile").click();
  });

  $("#importFile").addEventListener("change", event => {
    const file = event.target.files[0];

    if (file) importBackup(file);

    event.target.value = "";
  });

  $("#themeButton").addEventListener("click", () => {
    document.body.classList.toggle("light");

    localStorage.setItem(
      THEME_KEY,
      document.body.classList.contains("light") ? "light" : "dark"
    );
  });

  $("#menuButton").addEventListener("click", () => {
    $("#sidebar").classList.toggle("open");
  });

  document.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      event.preventDefault();
      saveCurrentBid();
    }

    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "n") {
      event.preventDefault();
      newBid();
    }

    if (event.key === "Escape") {
      $("#sidebar").classList.remove("open");
    }
  });

  if (localStorage.getItem(THEME_KEY) === "light") {
    document.body.classList.add("light");
  }

  renderEstimator();
})();
</script>
</body>
</html>
